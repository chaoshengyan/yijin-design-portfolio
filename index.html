    cards:[
      {src:'assets/projects/syncsight/syncsight_card_01.webp',tag:'RESEARCH',title:'Introduction',info:'项目｜VR 双眼节律训练',desc:'SyncSight 是一个面向外斜视相关双眼协调训练的研究型 VR 原型，运行在 Meta Quest Pro 上，通过音乐、语音与手柄震动反馈，把眼动追踪训练做成有节奏的互动体验。图中对比了内斜视（Esotropia）与外斜视（Exotropia）的眼位，流程为：头显采集眼动输入 → 注视稳定性检测 → 目标保持确认 → 实时音频与触觉反馈；双眼视野在“overlap”区融合，滑条用来调整视觉分离程度。定位是探索性训练模型，不是医疗器械，不做诊断、处方或临床结局承诺；目标是把单眼与双眼任务、音乐、语音反馈和互动整合进一个 VR 体验，为以后居家自训的设计准则打基础。',alt:'Introduction 页：项目描述、内斜视与外斜视眼位对比图、眼动追踪输入与实时反馈流程图、双眼视野重叠示意图'},
      {src:'assets/projects/syncsight/syncsight_card_02.webp',tag:'RESEARCH',title:'Market Survey',info:'调研｜两款参照',desc:'两款参照。AmblyoPlay 是定制的双眼训练程序：日常训练、游戏化练习、视频进度报告，双眼对比练习给每只眼不同的刺激，但需要连续数月每天坚持，评估依赖头戴式显示器，绿红滤光体验有限。Beat Saber 节奏结构清晰，方块按节拍从特定方向出现，配合音乐和震动能带来很强的“在节奏里”的沉浸感；但它是娱乐产品，画面与得分压力大，不含视觉追踪或校准。对 SyncSight 的启发：借 Beat Saber 的节奏感，用眼动和节律提示让玩家在反应前先保持注视稳定；做短时训练、个性化设置，用 Quest Pro 做单眼呈现与眼动追踪；同时控制音乐音量与触觉强度，避免训练过头。风险是如果为了紧凑而提高游戏节奏、画面密度和得分压力，会削弱训练效果。',alt:'AmblyoPlay 的三步使用说明与雷达图、Beat Saber 官网横幅与游戏画面，以及两款产品各自的 SWOT 分析',size:'narrow'},
      {src:'assets/projects/syncsight/syncsight_card_03.webp',tag:'RESEARCH',title:'Pre-test Duration Test',info:'调研｜训练时长预测试',desc:'早期用户反映眼动追踪交互时眼睛容易疲劳，所以在开发原型前先做了一次时长预测试：参与者盯着一个静止球，程序持续监测任务是否完成，疲劳可以自行停止，视线不稳时任务自动终止。Visual Scripting 里设定了初始值、每次打开重置、阈值判断和 10 秒后失稳上报。5 位成人参与者（均知情同意）全部完成 5 分钟测试，实际坚持时长从 326.851 秒到 634.461 秒（约 5 分 27 秒到 10 分 34 秒），个体差异明显；这些数据用来初步评估 VR 节律训练原型的可行性，并定位后续要优化的体验环节。',alt:'Pre-test Duration Test 页：进入判断与结束条件的两张场景截图、五位参与者时长折线图、预测试 Visual Scripting 流程图',size:'narrow'},
      {src:'assets/projects/syncsight/syncsight_card_04.webp',tag:'RESEARCH',title:'Research',info:'研究｜机制与音乐游戏化',desc:'两条研究依据。机制上，反抑制训练能改善小角度外斜的双眼单视与近距离立体视，但证据来自不同的斜视类型、样本也小，不能直接当作疗效；间歇性外斜的研究把红绿反抑制活动融入遮盖加肢体治疗后，远距与近距控制分数有提升。所以本游戏不声称治疗外斜视，而是把“任务依赖的双眼参与”转成受控的 VR 训练原型：先完成单眼信息输入，每只眼再分别接收双眼整合信息。转化上，传统红绿训练的四个要素对应音乐游戏的四个设计：单眼输入 → 左右眼互补的节奏与音轨；需要融合的任务 → 双眼完全融合后才记为命中；渐进难度 → 由易到难的音乐关卡（近处大而慢的目标，逐渐变小、变快、视差加大）；不适即停止 → 暂停键、舒适度评分、自动降难和专业复查。音乐游戏化的价值在持续注意、清晰目标、即时听觉与触觉反馈、可见进度，证据来自弱视研究，不能当作临床疗效。',alt:'Research 页：外斜视支撑机制文字、传统双色训练到 Quest Pro 音乐游戏的转化对照图、音乐游戏化文字与五条训练设计原则'},
      {src:'assets/projects/syncsight/syncsight_card_05.webp',tag:'INSIGHT',title:'Mind Mapping',info:'洞察｜思维导图',desc:'思维导图以“VR MUSIC GAME FOR EXOTROPIA”为中心。平台层是 Quest Pro 的眼动追踪、音频与触觉校准；它定义了双眼机制（双色提示、融合与反抑制参与）；要求训练精准度优先于画面真实感；通过音乐游戏化来激励（节奏提示、评分、反馈、渐进挑战）；用评估来衡量（可用性、参与度、注意力和训练流程清晰度）。约束是用户舒适与安全伦理：不适即暂停、记录症状、不做临床声明。底部是设计研究系统的三角：双眼训练、VR 技术、用户。',alt:'Mind Mapping 页整图：中心节点、Quest Pro 平台、双眼机制、音乐游戏化、评估、安全与伦理及底部三角'},
      {src:'assets/projects/syncsight/syncsight_card_06.webp',tag:'INSIGHT',title:'Personas',info:'人物｜两类相关者',desc:'两个暂定画像，由文献、市场回顾和原型范围推出，不代表临床用户或任何机构的员工。Dr. Leo Wang，28 岁，双眼视觉与 XR 研究者，标签：证据驱动、XR 熟练、原型导向、安全意识；需要可用于可用性测试的早期原型、识别用户负担与交互设计风险、产出可与临床合作的透明研究记录。Elena Novak，34 岁，数字视觉训练平台的产品开发者，标签：产品策略、游戏化意识、数据导向、可扩展；需要评估 VR 节律训练能否在不增加负担的前提下提升参与度、把眼动追踪变成可理解的反馈、定义安全的短期任务。两人都要求可配置的任务逻辑、节律速度、训练时长和可导出的表现记录。',alt:'Personas 页：Leo Wang 与 Elena Novak 的人物照片、标签、Behaviours、Goals 与 Basic Profile',size:'narrow'},
      {src:'assets/projects/syncsight/syncsight_card_07.webp',tag:'DESIGN',title:'Wireframe',info:'设计｜低保真线框',desc:'四个线框界面。Profile Setup 填写用户名与年龄；Calibration 用滑条把分离的双球拉回到重合，前后移动找两个切点，确定检测范围；Training 调节节律速度和左右目标位置，并说明训练背景与双眼视野特征；Session Archive 显示得分（280）、完成率 74% 与 92%，可查看记录、导出数据或再次训练。',alt:'Wireframe 页四个界面：Profile Setup、Calibration、Training、Session Archive',size:'narrow'},
      {src:'assets/projects/syncsight/syncsight_card_08.webp',tag:'DESIGN',title:'Training Workflow',info:'设计｜训练流程',desc:'训练流程 13 步：Welcome 开始/引导 → Consent 知情与安全声明 → User Profile → Baseline Test 对齐与追踪 → Headset Check 佩戴舒适与视野 → Calibration 重叠与目标 → Session Setup 节奏/时长/难度 → Music Training 对齐、融合、重复 → Session Summary 完成度与错误 → Progress 回看训练历史 → Next Step 再来一次或结束 → Settings & Safety 调整/暂停/退出；训练后进入 Live Feedback（节律与稳定性）。',alt:'Training Workflow 页的十三个蓝色图标节点、分支连线与每步说明'},
      {src:'assets/projects/syncsight/syncsight_card_09.webp',tag:'DESIGN',title:'User Journey Map',info:'设计｜用户旅程',desc:'四个阶段。Start：找短时、能融入日常的训练；阅读说明并选时长；情绪“好奇但不确定”；痛点是担心训练无聊或吓人；机会是把研究原型讲清楚，一次只做一个动作。Preparation：戴上头显、选模式、评估舒适度；“谨慎、寻求安心”；痛点是第一次用 VR 的陌生感和术语；用动画讲清校准，提供慢速与标准难度。Personalised calibration：滑动校准并验证节律；校准失败时原因不清楚；强调短时训练、随时退出、舒适提示，卡住时用触觉引导。Rhythm Training：专注目标、跟随节拍；专注、信心累积；节律太快或画面过载会走神；用低强度提示和触觉反馈在失稳时把人带回。',alt:'User Journey Map 页四阶段表：Goal、Action、Emotion、Pain point、Design opportunities 与情绪曲线'},
      {src:'assets/projects/syncsight/syncsight_card_10.webp',tag:'DESIGN',title:'Use Case Diagram',info:'设计｜用例图',desc:'三个参与者：User（训练者）、Quest Pro Eye Tracking（眼动输入）、Session Data Record（训练记录）。主流程：开始训练 → 检查舒适与安全（包含退出选项）→ 校准注视、设定参数 → 选择练习模式或标准节奏 → 完成节律任务（注视目标并判断重叠）→ 接收反馈（热/色/分数/触觉）→ 暂停或结束（不适时）→ 回看训练小结 → 保存记录。设计边界：研究原型，不诊断、不开处方、不声称临床结局。',alt:'Use Case Diagram 页：VR Rhythm Vision Training System 用例图与三个参与者',size:'narrow'},
      {src:'assets/projects/syncsight/syncsight_card_11.webp',tag:'DESIGN',title:'Storyboard',info:'设计｜六格分镜',desc:'六格分镜：① 传统训练重复枯燥；② 反馈与进度不清晰；③ Leo 介绍 VR 原型，欢迎页说明安全信息；④ 舒适度检查与基线校准；⑤ 节律视觉训练，左右眼各看不同目标；⑥ 训练小结决定下一步——重测、换难度或结束。主角 Lin Chen，24 岁，眼位不正，正在寻求专业建议。',alt:'Storyboard 六格手绘分镜：传统训练、不清晰的反馈、Leo 介绍原型、舒适度检查与校准、节律训练、训练小结',size:'narrow'},
      {src:'assets/projects/syncsight/syncsight_card_12.webp',tag:'PROTOTYPE',title:'Hi-fi Prototype',info:'原型｜高保真界面',desc:'Welcome 页点“Understand”进入安全声明；Who is training 显示难度随完成场次增加；校准页确认双眼视野的切点完全重合，可重置滑条；Build your session 自定义训练时长，按左手柄菜单键随时打开主菜单；训练界面实时显示完成率与稳定性，左右节律按钮可交替点击，命中时手柄震动；Baseline Check 建立本次训练的基线，不适会被引导回“Build Your Session”；Session Complete、Your Progress 统计、Pause or Exit；日期、时长、节律速度、目标完成率、最高连击与稳定性写入本地 JSON 供回看。',alt:'Hi-fi Prototype 页带黄色流程标注的界面：Welcome、Who is training、校准、Build your session、训练界面、Baseline Check、Session Complete、Your Progress、Pause or Exit'},
      {src:'assets/projects/syncsight/syncsight_card_13.webp',tag:'TEST',title:'Use Case Test',info:'测试｜用例测试',desc:'用例测试检查“UI 页面之间的逻辑流程是否顺畅”，在 Unity 编辑器场景中运行：点击 start 进入欢迎页、点击 understand 进入用户资料页、点击 continue 进入基线校准并在三秒后进入校准阶段，实际结果与预期一致。另一张表逐步记录校准滑条、开始训练、结束训练、关闭等 9 步：8 步通过，进入难度选择这一步记为 FAIL——音乐、训练界面与双眼圆没有同步出现，记在备注里待修。',alt:'Use Case Test 页两张测试表：测试信息、依赖、条件与控制，以及各步骤的预期结果、实际结果与 PASS / FAIL'},
      {src:'assets/projects/syncsight/syncsight_card_14.webp',tag:'DEVELOPMENT',title:'Development',info:'开发｜架构与脚本',desc:'开发分三段：校准、音乐训练、结果记录。先用 Visual Scripting 和 C# 搭好稳定输入与安全协议，再加音乐互动。对象层级里标出各模块：左右眼 OVREyeGaze、UI、摇杆、用于双眼稳定的虚拟平面检测、左右眼分离贴图、生成前移目标、音乐控制器（按节拍生成目标并控制速度）、左右眼分屏设置、初始状态设置、摇杆呼出菜单栏、数据记录。校准脚本负责状态检查、滑条输入、位置映射，并按不同难度系数得到校准间隔；音乐训练脚本负责命中检测、命中计数、手柄震动反馈、按帧监控训练状态和按节律刷新目标。',alt:'Development 页：带模块标注的 Unity 对象层级截图、校准与参数调整 Visual Scripting 图、音乐训练的命中检测与节律目标脚本图',size:'narrow'},
      {src:'assets/projects/syncsight/syncsight_card_15.webp',tag:'DEVELOPMENT',title:'Rendering',info:'开发｜双眼显示与视觉',desc:'双眼显示用 OVROverlay：给 Quest Pro 的左右眼各提供一张专用 RenderTexture，在 VR 合成层里作为前景叠加，背景仍在 Unity 3D 场景里；RenderTexture 先渲染到纹理而不是直接显示，作为左右眼互补内容的中间画布。首版用 512×512 或 1024×1024、低复杂度几何、无后处理，保证训练目标清晰并降低渲染开销。表里记录了挑战、设计决策与当前应对：3D 目标不会自然遮挡 → 把 Overlay 放在训练层最前；左右眼 RenderTexture 有性能负担 → 低分辨率 RT、低多边形；Game 视图无法预览真实双眼效果 → 只在 Quest Pro 上实测；Overlay 表达能力有限 → 核心融合符号、目标和提示放 Overlay，其余留在 3D 场景；遮挡不正确 → 调整物体重叠顺序和 Underlay 设置。视觉上用蓝到白的渐变背景和磨砂玻璃立方体，蓝色 #0D44FC 定呈现风格，荧光绿做反馈；HDR 贴图和 URP Shader 用于材质。',alt:'URP Shader 节点图、HDR 环境图、双眼显示方案文字，以及挑战 / 设计决策 / 当前应对对照表',size:'narrow'},
      {src:'assets/projects/syncsight/syncsight_card_16.webp',tag:'DESIGN',title:'Logo & UI Design',info:'设计｜Logo 与图标',desc:'Logo 由折射透镜的图形演化而来，配清理过圆角的无衬线字体，强调视觉平衡。图形演示光线穿过镜片偏折、视线在中心点汇聚、再逐步分开的过程，对应双眼协调训练。主色蓝 #0D44FC，代表信任与科技；荧光绿代表互动与音乐训练。字体用粗圆无衬线，亲和、可信、易读，内容在头显里也清楚。右侧是图标集：Home、Back、Help、Profile、Eye Tracking、Warning、Pause、Exit、Eye、Stability、Music、Progress、Results、Completion。',alt:'Logo & UI Design 页：透镜与重叠的 Logo 推导、色板、两组 SYNCSIGHT 标志、14 个 UI 图标与两段说明'},
    ]
  },

    cards:[
      {src:'assets/projects/falsetraces/falsetraces_card_01.webp',tag:'RESEARCH',title:'Market Survey',info:'调研｜三款参照游戏',desc:'调研三款参照：You Sleuth 用真实地图与手机做调查，玩家随时听证词、收情报，不挑地点、随时能玩，适合参考“闭环推理”；Manor House Murder Mystery 靠 ID 卡、地图与 AR 数据揭示线索，是限时的小组线下体验，适合参考线索组织与“房间制”调查结构；Eastern Market Murder 把街区历史与真实环境融进 AR 叙事，是地方文化体验而非细致查案，适合参考“真实场景 + AR 叙事”的融合。结论：本项目要做的是“走动、对话、搜索”兼备的单场景完整调查，而不只是点按线索。',alt:'You Sleuth 文字与截图、Manor House Murder Mystery 截图、Eastern Market Murder 文字与现场照片'},
      {src:'assets/projects/falsetraces/falsetraces_card_02.webp',tag:'RESEARCH',title:'SWOT',info:'调研｜SWOT 分析',desc:'把三款竞品与本项目放进 SWOT 逐项比较：You Sleuth 胜在随时可玩、上手门槛低，弱在缺少侦探现场的空间证据；Manor House 胜在团队协作与清晰的游戏结构，弱在法证科学层面的细节；Eastern Market 胜在场地沉浸，弱在依赖场地、学生原型难以复制。机会在于：它们的线索流与指控机制可作参考，把场景收进一间紧凑、便携的室内单房间，并强化 AR 犯罪叙事。风险是如果设计变成“mostly clue-tapping”，会和 You Sleuth 太像，也可能拉高对叙事制作水准的预期。',alt:'Market Survey (SWOT analyzing) 标题、四行 SWOT 对比表与结论段落',size:'narrow'},
      {src:'assets/projects/falsetraces/falsetraces_card_03.webp',tag:'RESEARCH',title:'Background & Problem',info:'问题定义｜痛点',desc:'国内的谋杀悬疑与密室体验，剧情完全依赖每个房间的固定实体布置，换一个故事就要重新装修，一次性设计既贵又耗时；图示为密室设计与搭建的参考成本区间（£10k–£50k+）。血迹等物证同样静态：血迹形态能反映撞击角度、速度与凶手位置，却很难用实体道具动态呈现。另一边，Forensic Detective、Oxygen 等犯罪现场 AR 应用已能在普通房间里叠加指纹、弹壳、血样等虚拟物证。由此确定问题：如何用可重复调整的 AR 虚拟证据，在不改造实体房间的情况下获得动态、可调查的现场。',alt:'Pain points 两段文字、密室设计与搭建成本柱状图、Forensic Detective 截图与犯罪现场 AR 应用说明',size:'narrow'},
      {src:'assets/projects/falsetraces/falsetraces_card_04.webp',tag:'RESEARCH',title:'Literature Review',info:'文献综述｜血迹与隐形痕迹',desc:'血迹形态分析（BPA）用大小、形状、分布与位置还原受限现场发生了什么，可判断武器类型、击打次数或枪击方向；故事据此设计——表面是被刀袭击，实际是刻意布置的现场。隐形痕迹部分：静电粉尘印提取能显出纸面与光滑表面上的鞋印，判断连续进出现场还是只有零散足迹；指纹显现常用鲁米诺（血迹）、氰基丙烯酸酯熏显，多孔表面先用 DFO / 茚三酮处理，荧光纳米材料也已有综述。图中的血迹类型、鞋印与荧光指纹示意图，对应游戏里“扫描后在 AR 中显形”的证据类型。',alt:'鲁米诺显出血迹的照片、静电粉尘鞋印、荧光指纹九宫格、血迹类型图与 Relevance 说明'},
      {src:'assets/projects/falsetraces/falsetraces_card_05.webp',tag:'INSIGHT',title:'Brainstorming',info:'洞察｜脑暴网络',desc:'从个人体验（密室、解谜游戏）与“密室机制很巧、但故事过后留不下来”的感受出发，把想法分成四组：AR Feature（扫描真实空间、放置虚拟证据、真实法证痕迹、AR 空间扫描、调查搭档、重建案情时间线、引导交互）；Logical（发现线索、证据逻辑、AI 搭档、动态证据调整、多结局）；Storytelling（动态证据摆放、多结局、同一现场不同结局）；以及市场缺口——实体道具成本高。由此收敛出“真实空间 + 虚拟证据 + AI 搭档”的核心方向。',alt:'Brainstorming 便签网络图：Personal Experiences、AR Feature、Logical、Storytelling 与 Market Gap 五组便签及连线'},
      {src:'assets/projects/falsetraces/falsetraces_card_06.webp',tag:'RESEARCH',title:'Questionnaire',info:'调研｜问卷 n=10',desc:'共收集 10 份问卷：全部受访者玩过调查或谋杀悬疑类游戏，半数常用 AR，类型上 30% 极其喜欢、50% 有些喜欢，50% 对尝试 AR 谋杀悬疑很感兴趣。功能上最看重隐藏线索（20%）与可调查的证据（40%）；最重要的仍是故事（60%），其次是法证线索与易用的交互。结论：原型应采用故事驱动的可视化调查，在新用户上手阶段用简单直观的“点击收集”，并配 AR 引导层与分步提示。',alt:'问卷 Overall 文字与 Q1–Q6 六组条形图：是否玩过、类型偏好、AR 使用频率、尝试意愿、AR 功能、最重要因素',size:'narrow'},
      {src:'assets/projects/falsetraces/falsetraces_card_07.webp',tag:'RESEARCH',title:'Interview',info:'调研｜五位玩家',desc:'通过电话或文字访谈五位有相关经验的玩家。共同点是看重故事、搜索与揭开证据的过程，并希望“简单交互、自由探索、系统引导”三者平衡；顾虑是技术不稳、界面复杂、手机使用会打断调查。P1–P5 的关键词表显示：偏好真实场景触发，担心手机负担与 AR 眼镜负担；喜欢的元素是氛围与新鲜的证据形式；要避免的是硬操作、误导信息、按钮过多和线索太难。',alt:'Interview Overall 文字与 P1–P5 五位受访者的关键词回答表',size:'narrow'},
      {src:'assets/projects/falsetraces/falsetraces_card_08.webp',tag:'NARRATIVE',title:'Storytelling',info:'叙事｜故事内核',desc:'案情主线：案发当晚 A 进入 B 的房间，穿着 C 的鞋走出误导性的脚印，把 D 的药瓶放在旁边，从屋内反锁房门，在自己身上制造表浅的刺伤来模仿搏斗，随后服毒，死在 B 的房间。调查先指向 B，再指向 C 与 D；但把血迹、放错的物证和指纹单独来看，最终揭示真相——整个现场是 A 自导自演。人物为受害者 A 与嫌疑人 B、C、D，图中标出 Ringleader、Humiliation、Victim / scene planner 等动机线索；验尸报告助理给出真正死因，指向“Poison → self-staged”。',alt:'Storytelling 页面：Core reading 文字、A–D 人物拍立得、指纹、药瓶、脚印、反锁房间与验尸报告的连线图'},
      {src:'assets/projects/falsetraces/falsetraces_card_09.webp',tag:'INSIGHT',title:'Personas',info:'人物｜两类玩家',desc:'两类目标玩家。Lin，22 岁，设计专业本科生，谋杀悬疑爱好者、重玩型：想要不只是拼图的沉浸体验，享受拼线索，期待反转结局和用自己的演绎去解释；常去密室，使用智能手机和 AR 应用，习惯扫描码、拍照与 AR 交互；需要的是“可信的犯罪现场”——血迹方向、轨迹、指纹和其他痕迹能讲故事，同一房间能承载不同案件组合。Mei，32 岁，谋杀悬疑 / 密室场馆老板兼设计师，探索新玩法：希望把 AR 与 AI 作为新卖点引进场馆，降低翻新成本，需要操作面板让员工快速重置案件与切换结局。',alt:'Personas 页面：Lin 与 Mei 的立绘、标签、Basic Profile / Goals / Behaviours 与 User Needs'},
      {src:'assets/projects/falsetraces/falsetraces_card_10.webp',tag:'NARRATIVE',title:'Journey Map',info:'流程｜游戏旅程与情绪',desc:'游戏旅程六步：Enter the scene（快速理解案情，好奇、专注）→ Scan the room（扫描血迹、脚印、物件，线索显得“更真实”，警觉、投入）→ Talk with AI partner（不直接给答案，而是引导思考，被支持、有信心）→ Match evidence（线索连成叙事，满足、沉浸）→ Build a theory（单间场景信息略多，需要记时间线与比较嫌疑人，是痛点；案件面板与 AI 回顾是机会）→ Reveal + Replay（对比推理与结局，想立刻再玩，奖励感、好奇）。情绪曲线：Curious → Engaged → Supported → Satisfied → Tense → Rewarded。关键机会：把实体证据转化为故事驱动的 AR 交互。',alt:'Gameplay Journey 六张阶段卡（目标、行动、想法、情绪）与 Emotional Arc 情绪曲线',size:'narrow'},
      {src:'assets/projects/falsetraces/falsetraces_card_11.webp',tag:'NARRATIVE',title:'Workflow',info:'流程｜游戏流程',desc:'完整流程：Start → Main Menu（Play / Exit）→ Case Briefing → Enter Crime Scene → Scan Evidence → View Clue Details → Talk to AI Partner → Match Evidence → Build Theory → Submit Deduction → Case Outcome → Replay / New Case → End。红色为玩家主路径，蓝色虚线是回查线索的循环：扫描后可回到线索详情、找 AI 搭档，或在提交前回头重建理论；结局后可换一套证据重开。另绘制用例图，三个参与者为 Player、AI Partner 与 Evidence Database。',alt:'Workflow 流程图三行节点、主路径与回查虚线、图例',size:'narrow'},
      {src:'assets/projects/falsetraces/falsetraces_card_12.webp',tag:'NARRATIVE',title:'Storyboard',info:'分镜｜六格',desc:'六格分镜：① 开场台词“我们最近引入了 AR 技术，可以直接用手机调查犯罪现场”；② Jim 拿起手机对准房间里布好的现场；③ 镜头俯视死者轮廓与散落的证据——药瓶标签 ID #14、刀（EVIDENCE ID #03）；④ 点开手机上的证据卡；⑤ 屏幕呈现案情信息与嫌疑人名单；⑥ 情节反转后打出五星评价。分镜确定了“手机对准实物 → 弹出证据卡 → 证据指向嫌疑人”的核心画面。',alt:'Storyboard 手绘六格分镜：两人对话、手机对准现场、死者轮廓与药瓶刀、证据卡、案情信息与五星评价'},
      {src:'assets/projects/falsetraces/falsetraces_card_13.webp',tag:'PROTOTYPE',title:'Hi-fi Prototype',info:'原型｜高保真界面',desc:'竖屏界面流程：标题页 Play / Exit（Exit 直接退出游戏）；点击对讲机呼叫警员，引入语音识别功能；返回搜索页重新拍照；用取景框扫描后进入 Evidence details，查看脚印、血迹等细节；把证据拖给相关人物即可发送并连线——拖错会得到提示，拖对则解锁推动剧情的新证据；底部固定人物卡与证据卡卡槽，可对比指纹、回看线索。',alt:'五张竖屏界面：标题页、案情简报与警员、对讲机、证据详情、把证据连到嫌疑人，以及下方交互标注'},
      {src:'assets/projects/falsetraces/falsetraces_card_14.webp',tag:'PROTOTYPE',title:'3D Model & UI',info:'原型｜3D 模型与 UI',desc:'3D 部分：扫描得到的人偶模型先在 C4D 里清理，再导入 Unity，加上血迹贴图；下方为同一模型从扫描、清理到带血迹的三步对比。UI 沿用“手账 + 证物袋”的视觉：手写便签里写着“保持 HUD 极简、减少文字”，返回、扫描、取消等图标做成墨线贴纸，对讲机与相机是主要入口；人物卡与证据卡（Footprint、Clothes with blood、Fingerprint 等）做成拍立得与封口袋，用红色标签标类别。',alt:'3D model 人偶与 C4D、Unity 三步对比，以及 UI 图标、便签、人物卡与证据卡',size:'narrow'},
      {src:'assets/projects/falsetraces/falsetraces_card_15.webp',tag:'DEVELOPMENT',title:'Unity Prototype',info:'开发｜Unity AR 原型',desc:'AR 框架由四部分组成：AR Plane Detection 检测地面与桌面、AR RaycastManager 把点击落到真实平面上、AR Tracked Image Manager 识别带图案的证据图卡，并用截图功能捕捉证据细节。GameManager 集中管理音效与角色立绘的播放，在 AI 说完后开始校准并生成犯罪现场；PhotoCaptureManager 负责拍照区域、画布与 RawImage，把拍到的画面存成证据。',alt:'Unity Inspector：AR Plane / Raycast / Tracked Image 组件、GameManager 与 PhotoCaptureManager 面板，以及红笔标注',size:'narrow'},
      {src:'assets/projects/falsetraces/falsetraces_card_16.webp',tag:'DEVELOPMENT',title:'Shader & Animation',info:'开发｜Shader 与动画',desc:'用 URP 的 Shader Graph 生成可计算的网格（FinalGrid = GridX·WeightX + GridY·WeightY + GridZ·WeightZ），网格大小、线宽、边缘柔度、滚动与发光都可调，做出接近科幻扫描仪的效果，作为“扫描成功”的反馈与高光。笔记本翻页用逐帧序列（带透明通道的 PNG 帧）制作翻页动画，在 Timeline 里编排，动画结束后才显示笔记本里的内容；控制脚本在动画结束时切换内容。',alt:'Shader Graph 网格计算节点图、材质 Inspector、笔记本翻页帧序列、Unity Timeline、动画控制代码与 Animator'},
      {src:'assets/projects/falsetraces/falsetraces_card_17.webp',tag:'TEST & FIX',title:'Click Logic & Test Fix',info:'开发与修复｜点击逻辑与测试',desc:'点击逻辑优化做了四件事：把被点中的证据移到最上层，避免被其他证据挡住；统一管理证据实例；拖拽证据时生成红色连线，把人与证据连起来；管理连线的显隐，最终在结局卡上呈现人物、脚印、指纹与衣物的连线。测试在 Samsung A12 上进行，共五张测试用例表（应用整体、AR 功能、对讲机、场景交互、拍照）。Overview 记录的问题：点击转语音识别不稳定、按钮位置不当导致多次误触、锁屏时弹出 UI、元素在相机画面上重叠、白底文字可读性差、AI 警员立绘掉出画面，以及页内翻页动画与人物对话字幕出现太早。',alt:'Unity 代码截图与红笔标注（上移证据、管理实例、生成红线、连线）、Final result 连线卡，以及 Samsung A12 的五张测试用例表与 Overview'},
      {src:'assets/projects/falsetraces/falsetraces_card_18.webp',tag:'TEST & FIX',title:'AI Partner & Limitation',info:'局限｜AI 搭档未接入 API',desc:'AI 搭档按 ConvAI 的角色面板设计：State of Mind、Embodied Actions、Narrative Design、External API 与 Publish，背景故事写到 A–D 四人各自的秘密与关系；Sample Dialogues 里预写了“椅子被打翻了，什么意思？”“这是对的吗？”“现在序列更清楚了”等对话，AI 不直接给答案，而是让玩家回到现场找证据。局限照实写：原计划把 ConvAI 接入 Unity，角色也已建好，但官方不再支持 Narrative Design，最终没能把 API 接进 Unity，许多关键的证据与叙事驱动反馈是缺失的。',alt:'ConvAI 角色面板（State of Mind 等菜单）、角色背景故事、未接入 API 的说明文字与示例对话',size:'narrow'}
    ]
  },
  journal:{

    title_1:'jOURnal', title_2:'XR 三维日记',
    intro:'「jOURnal」是以记忆为主题的 XR 三维日记：把照片、视频、声音、手写与 3D 扫描物件放进同一个记忆空间，在手机端收集与编排，在 VR 中重回现场——journal, give your memory a place to live. 小组项目（4 人），本人任组长，负责分工与进度、UI 图标设计与展示视频的 AI 内容生产；最终成绩 70+。',
    tags:['XR DIARY','UNITY · MRTK3','AIGC PIPELINE'],
    stats:[{num:'4',label:'TEAM MEMBERS · 组长'},{num:'70+',label:'FINAL SCORE'},{num:'30',label:'UI ICONS'}],

    hero_alt:'jOURnal VR 原型实机画面：现实房间里的记忆墙与悬浮的记忆物件',

    filters:['RESEARCH','INSIGHT','NARRATIVE','BRAND','FLOW','PROTOTYPE'],
    cards:[
      {src:'assets/projects/journal/journal_card_01.webp',tag:'RESEARCH',title:'Background Research',info:'调研｜二手研究',desc:'二手研究从记忆衰退的生理机制出发：长期依赖外部记忆辅助会削弱记忆保持（Sparrow, Liu and Wegner, 2011）；WHO 2022 年报告指出睡眠不足正在全球蔓延，睡眠不足会损害海马体、间接影响工作记忆。Gallup 2024 年报告显示全球负面情绪处于高位，长期压力与皮质醇升高会导致海马体萎缩。右侧流程图把“提取记忆”拆成录制、编辑、交互、重标注、自主生成到收集的循环。',alt:'Second Hand Research 文字、脑区示意图、Gallup 情绪报告折线图与提取记忆流程图'},
      {src:'assets/projects/journal/journal_card_02.webp',tag:'RESEARCH',title:'Market Survey',info:'调研｜五款笔记 App 对比',desc:'对比 Apple Notes、Notion、Evernote、Day One 与 Google Keep：它们在跨平台、学习成本、订阅价格、多设备同步上各有短板，共同点是都停留在二维内容与线性工作流，无法承载空间语境，也难以带来沉浸式的回忆体验。',alt:'五款笔记应用的对比表：关键功能、优势、劣势与最适合人群',size:'narrow'},
      {src:'assets/projects/journal/journal_card_03.webp',tag:'RESEARCH',title:'Pain Points',info:'调研｜三个局限',desc:'现有软件被困在二维内容和线性工作流里，既不能保存空间语境，也不能支持沉浸式的、凭直觉的感知与创作。由此归纳出三个局限：2D 录制无法捕捉空间结构，用户难以在真实的三维场景中表达自己；用户无法以三维方式组织、唤起或编辑想法；入口门槛高，需要打开应用、找到页面、手动录入内容，交互流程不够轻量。',alt:'对比表的劣势与适用人群两行、结论文字，以及 2D Recording、Lack of immersion、Entry barrier 三个痛点',size:'narrow'},
      {src:'assets/projects/journal/journal_card_04.webp',tag:'INSIGHT',title:'Why 3D',info:'洞察｜2D 与 3D 的取舍',desc:'在快节奏生活里，人们越来越需要保存记忆与情感连接。XR 3D 日记通过混合文字、图像与三维虚拟环境，能制造长时的记忆编码与唤起；但传统记忆保存方式有照片易丢、专辑易散、信息难找、数据遗产难传等问题。右侧表格逐项比较空间理解、文字密集度、导航、沉浸、快速决策与空间记忆训练六类任务在 2D 与 3D 下的表现，最终选择用 3D 呈现记忆；目标人群是 18–35 岁、重视生活记录与科技体验的人群。',alt:'Overview Context 段落、People 目标人群描述，以及 2D / 3D 任务类型推荐格式表'},
      {src:'assets/projects/journal/journal_card_05.webp',tag:'INSIGHT',title:'Idea Generation',info:'洞察｜从医疗到日常',desc:'创意从医疗场景的问题出发：ADHD、阿尔茨海默病早期、认知衰退与焦虑抑郁，都指向“记忆与认知功能”这一主题。设计动机随之改变，从解决医疗问题转向日常愉悦——当人在创作中产生新想法时，海马体与内侧前额叶皮质被显著激活，创造力本身可以直接增强记忆形成。于是概念落到“一个 3D 日记工具”：收集记忆（照片、视频、3D 模型、场景）并唤起记忆。',alt:'Idea Generation 页面左栏的医疗问题、头部行为示意图与“From medical problems / To daily pleasures”，右栏的创造力与记忆研究及“a 3d journal tools”'},
      {src:'assets/projects/journal/journal_card_06.webp',tag:'RESEARCH',title:'Interview',info:'调研｜三位受访者',desc:'围绕“记忆”访谈三位设计专业受访者（22–23 岁）。有人正在学习 VR 设备知识，认为手机就能便捷记录，纸面记录也有优势，电子文档反而可能在多次转手中丢失；有人把“记忆可视化”理解为把看不见的东西变成看得见的，像数据变成图表，并愿意在社区里分享有趣的部分；也有人强调场景还原需要亲历者与旁观者的描述，照片和视频要放回场景，是否信任电子记录取决于想保存的是哪类记忆。',alt:'Interview 页面的受访卡片与三位受访者的照片、基本信息和回答，照片已模糊',size:'narrow'},
      {src:'assets/projects/journal/journal_card_07.webp',tag:'RESEARCH',title:'Questionnaire',info:'调研｜问卷结果',desc:'问卷围绕三个问题：是否愿意与他人分享记忆、怎样看待用照片、视频、声音、文字唤起记忆，以及是否信任用电子方式收集记忆。饼图标出各选项的占比，用来判断分享意愿、记录方式偏好与对电子记录的信任度。',alt:'三张问卷结果饼图与对应的三个问题',size:'narrow'},
      {src:'assets/projects/journal/journal_card_08.webp',tag:'NARRATIVE',title:'Storyboard & Persona',info:'叙事｜Tanya 的分镜',desc:'人物 Tanya，23 岁，爱好旅行与绘画。她带着朋友去海边旅行，想用手机全景记录当下却没能留住完整感受；她拿出手机翻看旧照片，记忆只剩片段。分镜继续：在 VR 里，物件悬浮在眼前，每件物品都对应一段经历；点击高亮物件，场景随之切换，她被送回海边；最后她拖拽物件重新布置记忆空间，并把这段记忆分享出去。',alt:'Storyboard 页面：Tanya 的人物卡与九格分镜中的海边旅行、翻看照片、VR 中悬浮的物件与点击触发场景'},
      {src:'assets/projects/journal/journal_card_09.webp',tag:'INSIGHT',title:'Solution',info:'方案｜架构与 3D 内容生成',desc:'方案回应五个问题。用户接受度：沿用用户熟悉的软件操作，并与基础手势一一对应（如捏合拖拽识别物件），通过用户反馈逐步过渡到 XR 优化的交互；软件层面用 Unity + MRTK3 + OpenXR 做跨平台开发。3D 内容生成：用 KIRI 扫描物件，保存主体与场景两版，分别支持 HoloLens 的物件模式与 VR 的场景模式。用户引导用预置物件 + 情绪贴纸降低上手门槛；社区以自愿分享、一定范围内可见的规则保护隐私。',alt:'Solution 页面的 Q1 用户接受度、Q3 3D 建模与内容生成流程图，以及 Q5 社区建设文字'},
      {src:'assets/projects/journal/journal_card_10.webp',tag:'BRAND',title:'Brand & Logo',info:'品牌｜标志与色彩',desc:'品牌名 jOURnal 来自手写笔记本，大写的 OUR 把记忆从“我的”变成“我们的”。标志由几片记忆碎片聚成一块拼图，辅助图形是拼图与云的轮廓。主色是品牌黄 FFD000 / FFB700 与深灰 252525，灰阶用于信息层级。',alt:'jOURnal 标志与字标、标志释义、色板、灰阶与 Do 规范、辅助图形',size:'narrow'},
      {src:'assets/projects/journal/journal_card_11.webp',tag:'BRAND',title:'Icon Set',info:'品牌｜30 个图标',desc:'30 个磨砂玻璃质感的图标，用统一的圆形底、柔光和高光区分功能：确认、帮助、取消、社区、浏览、3D 模型、分享、评论、暂停、收藏、再次、搜索、图片、文字、锁、语音、视频、地图、用户、返回等。图标在登录页、社区、创建与存储模块中复用。',alt:'30 个磨砂玻璃风格的黄色功能图标',size:'narrow'},
      {src:'assets/projects/journal/journal_card_12.webp',tag:'FLOW',title:'UI Workflow',info:'流程｜用户流程与协作',desc:'界面分五个模块：Community、Create、Source、Sticker、Storage。收集流程从社区进入创建，选择照片、视频、3D 模型，按类别整理，编辑后跳转其他应用或存回；唤起流程按时间、地点、人物或情绪筛选，支持邀请他人进入自己的记忆空间。分享与协作流程区分公开社区、好友动态与私信邀请，并区分纯查看和可编辑的权限。',alt:'Collection User Flow、Retrieve memories workflow 与 Sharing & Collaboration 三张流程图'},
      {src:'assets/projects/journal/journal_card_13.webp',tag:'FLOW',title:'Interface Design',info:'界面｜创建流程与五大模块',desc:'手机端创建流程从 Loading、登录、注册、开始、添加素材、扫描 3D 模型、命名、保存、声音、文字到导入照片视频，每一步只保留一个主操作。五个模块各自沿用同一套网格和组件：社区浏览、创建记忆、素材来源、贴纸与存储。视觉上采用柔化的玻璃拟态，黄色渐变做氛围，半透明磨砂卡片保证信息层级和呼吸感。',alt:'五个模块的界面缩略图、手机端创建流程界面，以及 Visual Application 说明与界面应用图'},
      {src:'assets/projects/journal/journal_card_14.webp',tag:'PROTOTYPE',title:'Prototype App',info:'原型｜App 界面',desc:'App 原型在平板与手机两种尺寸上布局：首页、创建、素材库、社区与存储各自成页，Frame 1–17 用连线标出页面之间的跳转关系。',alt:'平板上排布的 App 界面图，以及 Frame 1–17 的手机界面连线图',size:'narrow'},
      {src:'assets/projects/journal/journal_card_15.webp',tag:'PROTOTYPE',title:'VR Development',info:'原型｜VR 开发说明',desc:'VR 端用 Unity 把设计资产拆成可复用的 Prefab 与 UI 资源，以多 Canvas 架构组织，让不同模块在同一场景中复用、降低切换成本。交互上实现了多模态内容导入、画布拖放、多状态反馈与导航栏结构；关键任务流程平滑，并用 Animator 与 Timeline 做动效，为渐变光照、按钮反馈与翻页过渡做出接近成品的节奏。',alt:'Development Process 文字说明与手持 Quest 3 头显的产品照',size:'narrow'},
      {src:'assets/projects/journal/journal_card_16.webp',tag:'PROTOTYPE',title:'Prototype VR',info:'原型｜Unity 画面',desc:'VR 原型在 Unity 中实现：Passthrough 把现实房间作为背景，记忆物件、照片墙与面板悬浮在真实空间里；点击关联物件进入全景照片或视频，支持选择性沉浸与头显内的记忆重收藏。画面为 Unity 运行截图与头显实拍。',alt:'Unity 运行截图：CREATE / HISTORY / COMMUNITY 面板、Project 卡片、Real-time Photo 实拍与记忆墙'}
    ],
    extra:{
      id:'journal-aigc',
      title:'AIGC Application · AI 辅助内容生产',
      intro:'展示视频由 AI 生成影像与真实原型录制两部分合成。流程：先用可灵 AI 按分镜生成关键画面（确定人物、场景与色调），再参照宣传片的镜头语言，结合参考图与提示词逐镜做图生视频；在剪映中按章节拼接 AI 镜头，统一节奏与转场；App 界面流程录屏导入 After Effects 做透视、跟踪与动效合成；最后与 XR 原型的实录画面剪辑成片。视频片尾附有 AI Declaration，注明难以实拍的画面由 AI 生成或增强。',
      tags:['KLING AI','IMAGE TO VIDEO','JIANYING','AFTER EFFECTS','COMPOSITING'],
      cards:[
        {src:'assets/projects/journal/journal_card_17.webp',tag:'AIGC · IMAGE',title:'AI-Generated Footage',info:'AI 影像｜可灵图生视频',desc:'片头叙事段落全部由可灵 AI 生成：海边小镇的傍晚、沙滩上的背影、戴上头显的女生、眼睛特写、串珠与贝壳，以及两位朋友在海边戴上 Quest 3 的画面。做法是先文生图定下人物形象、场景与暖黄色调，再以首帧图 + 参考宣传片镜头 + 提示词做图生视频，保证同一角色与色调在多个镜头间保持一致。',alt:'可灵 AI 生成的四个镜头：海边傍晚、戴头显的女生、串珠特写、两位朋友在海边'},
        {src:'assets/projects/journal/journal_card_18.webp',tag:'AIGC · PRODUCT',title:'AI Stylisation in Product',info:'产品设想｜AI 风格化服务',desc:'AI 同样被设计进产品本身：系统架构为「Mobile App ↔ Backend API + Storage ↔ AI 风格化服务 ↔ HoloLens / AR 客户端（Unity）」。后端提供 AI 风格化服务，用户在 App 内选择风格，网页端的风格处理在上传模块内完成，帮助用户快速做出更有个人感的创作；同时引入大语言模型辅助设计，让创建流程更顺。VR 端用手部跟踪、移动端用触摸交互，并限制模型面数以保证设备性能。',alt:'Solution 页面中的系统架构图、AI 风格化与大语言模型辅助的说明文字',size:'narrow'},
        {src:'assets/projects/journal/journal_card_19.webp',tag:'AIGC · PIPELINE',title:'AI Production Pipeline',info:'流程｜从图像到成片',desc:'五步流程：① 图像生成——可灵 AI 按分镜生成关键画面，先确定人物、场景与色调；② 图生视频——参照宣传片的镜头语言，结合参考图与提示词逐镜生成动态素材；③ 剪映拼接——按章节结构排列 AI 镜头，统一节奏与转场；④ AE 合成——App 界面流程录屏做透视与跟踪，合成进画面；⑤ 成片剪辑——与 XR 原型实录合并，输出展示视频。',alt:'AI Production Pipeline 流程图：图像生成、图生视频、剪映拼接、AE 合成、成片剪辑五步',size:'narrow'},
        {src:'assets/projects/journal/journal_card_20.webp',tag:'AIGC · COMPOSITING',title:'Motion Compositing',info:'合成｜录屏、原型与生成影像',desc:'中后段画面由三类素材合成：VR 记忆墙、社区面板、3D 模型扫描与评论来自 XR 原型的实录；App 界面流程先录屏，再在 After Effects 中做透视、跟踪与动效，合成到人物手持设备的画面上；右下角佩戴头显的体验者画面为生成影像，作为画中画提示当前体验状态。两类素材按章节结构统一调色与节奏后输出。',alt:'VR 记忆墙、社区面板、3D 模型扫描与评论面板四个实录画面，右下角为戴头显的体验者画中画'}
      ]
    }
  },
  elf:{
    parent:['ai'],
    category:'VR EYE-TRAINING GAME · UNITY + CONVAI + META QUEST PRO / UNIVERSITY OF LEEDS / 2026',
    title_1:"Where's the Elf", title_2:'VR 眼动对话游戏',
    intro:'「Where\'s the Elf」是一款用眼动和语音来玩的 VR 训练游戏：玩家在梦里身体动不了，只能靠眼睛去找精灵 Jin。Jin 由 ConvAI 驱动，全程用对话引导训练：注视命中会累计连击，连击到 3 和 5 时切换话题，断连时给出鼓励，聊天里顺带讲护眼知识。项目面向 13–24 岁低度近视人群，是探索性的训练游戏，不是医疗器械。',
    tags:['VR GAME · UNITY','CONVAI · NARRATIVE TRIGGER','EYE TRACKING · QUEST PRO'],
    stats:[{num:'0.15 s',label:'GAZE HOLD PER HIT'},{num:'3 / 5',label:'STREAK TRIGGERS'},{num:'5 min',label:'SESSION LIMIT'}],
    hero:'assets/projects/elf/elf_hero.mp4',
    hero_poster:'assets/projects/elf/elf_hero_poster.webp',
    hero_alt:'Where\'s the Elf 实机画面：躺在卧室里的第一视角，白色光球作为训练目标出现在前方',
    filter_title:'只能用眼睛找它，它负责把训练聊下去',
    filter_intro:'按“概念—角色—对话设计—开发—实录”组织：01 概念与分镜，02 NPC Jin 的人设与说话方式，03 知识库与示例对话，04 连击触发对话的系统，05 注视交互对话流程，06 关键脚本，07 语音输入，08 眼动场景与实机录屏。',
    filters:['CONCEPT','CHARACTER','DIALOGUE','DEVELOPMENT','DEMO'],
    cards:[
      {src:'assets/projects/elf/elf_card_01.webp',tag:'CONCEPT',title:'Concept & Scenario',info:'概念｜只有眼睛能动的梦',desc:'灵感来自一次睡眠麻痹：午睡醒来身体动不了，眼睛能看见四周、意识也清楚，像是只能靠眼动和听觉去感知世界。由此定下「一个只有眼睛能动的场景」，把眼动训练、游戏化、叙事、对话 AI 和巴洛克风格的 Chill Dance 放在一起，目标人群 13–24 岁，每次时间短、能放松。分镜：15 岁的小明写作业到深夜，长时间近距离用眼后眼睛不适，爸爸拿出 VR 头显让他放松；进入梦境后，先注视远处的方形望远镜 3 秒，确认眼动追踪正常；随后巴洛克音乐响起，高光按节拍顺时针、逆时针循环出现，同时 ConvAI 和玩家互动反馈，讲解用眼知识。',alt:'Idea generation 思维导图：睡眠麻痹的故事引出「一个只有眼睛能动的场景」，连到 VR 眼动训练、对话 AI、游戏化、巴洛克音乐和沉浸体验；下方是分镜 5 和 6 的游戏内画面：墙上的方形望远镜，以及躺在床上看到的房间'},
      {src:'assets/projects/elf/elf_card_02.webp',tag:'CHARACTER',title:'NPC Jin',info:'角色｜精灵的人设与说话方式',desc:'精灵 NPC 叫 Jin，性格调皮、爱吐槽、话多，用夸张的比喻鼓励玩家练习「用眼睛找到你」。不说教，把护眼习惯包成轻松的小彩蛋。边界写进了人设：玩家说「闭嘴 / 安静 / 别说了 / 我没在听」时，最多再回一句俏皮话，然后静音 30 秒；被拒绝三次后停止科普和长篇独白，用不超过一句话的失望语气回应，等玩家下一步。安全规则：只给一般性的低风险护眼建议，不做诊断；玩家提到眼痛、视力突然变化或剧烈头痛时，建议停止并寻求专业帮助。说话风格：轻松爱玩，表扬要具体说出玩家哪里做得好；提醒要温和并给选择，比如「休息一下？」，不直接下命令。下方雷达图是它的五维性格设定。',alt:'ConvAI 角色页截图：Jin 的核心描述和边界规则、说话风格，以及一张五维性格雷达图和金色线描的小精灵',size:'narrow'},
      {src:'assets/projects/elf/elf_card_03.webp',tag:'DIALOGUE',title:'Knowledge Bank',info:'对话｜知识库与示例台词',desc:'知识库里只放了一个 advice.txt（941 字节），分四组：屏幕与休息、近视与户外、饮食、安全。内容都是短句，比如「如果看屏幕有一会儿了，抬头看看远处休息一下」「户外时间有助于预防或推迟儿童近视」「均衡饮食、多吃彩色蔬果对眼睛好，胡萝卜是经典例子但不是魔法」；安全那组写的是眼痛、视力突变或剧烈头痛时要停下并咨询专业人士。示例对话：Jin：「嘘，别用头找我，用眼睛。让视线像探照灯一样扫一圈，我会在你最没想到的时候冒出来。」玩家：「你在哪？」Jin：「猜猜看，我就在你刚才差一点看到我的地方。」Jin：「眨眼，被你抓到了！刚才那次很准，这双眼睛是专业的。」Jin：「三连！你的眼睛现在像磁铁。」',alt:'ConvAI 知识库截图：advice.txt 文件；下方是屏幕与休息、近视与户外、饮食、安全四组护眼提示，以及 Jin 和玩家的四段示例对话',size:'narrow'},
      {src:'assets/projects/elf/elf_card_04.webp',tag:'DIALOGUE',title:'Hit Streak Triggers',info:'对话设计｜连击触发对话',desc:'游戏里大部分交互是「眼动注视 → AI 对话反馈」，所以原型阶段直接用 XR 注视交互对话流程代替了界面线框。逻辑：RegisterHit() 时连击数和总命中数各加一；RegisterMiss() 把连击清零；连击到 3 切到 S2，到 5 切到 S3。NPC 响应由 ConvAI 按上下文生成：到里程碑时表扬，失败时鼓励，叙事设计触发器负责切换段落。玩家输入：注视目标并停留，约 0.15 秒算一次命中；移开视线 1 秒以上算中断；1 秒没有新命中判定未命中，可配置。ConvAI 一侧，Jin 身上挂了 3 个 Narrative Design Trigger，各自对应一段剧情；GameManager 里的 HitStreakManager 调用 InvokeSelectedTrigger()。右上是 TRG_STREAK1、3、5 三个触发器连到不同剧情段落的示意，右下是 Unity 检视器里挂在 Jin 上的这三个触发器。',alt:'Prototype 页：左侧说明文字，右上 ConvAI 叙事设计触发器示意图（三个蓝色触发器连到五个黑色段落），下方是用户输入、系统逻辑、NPC 响应和关键配置值四栏，右侧是 Unity 检视器里 Jin 上的三个叙事设计触发器'},
      {src:'assets/projects/elf/elf_card_05.webp',tag:'DIALOGUE',title:'Conversation Flow',info:'对话设计｜注视交互对话流程',desc:'六个状态加一个重试分支。S0 进入场景 / 空闲：玩家环顾，系统等待注视，NPC 欢迎或待机。S1 首次命中：连击 1，注视目标 0.15 秒，系统调用 RegisterHit，NPC 说「好的开始，继续」。S2 连击 3：完成三次连续命中，触发 Streak3 触发器，NPC 说「不错！试着到 5」。S3 连击 5：保持五次命中，触发 Streak5，「出色！任务完成」。S5 任务完成：最后的鼓励，或引出下一个挑战。S4 连击中断：超过 1 秒没有命中，触发 Broken，「专注，保持稳定」，再走 A1 重试：连击归零，回到 S1。',alt:'XR Gaze Interaction Conversation Flow 流程图：S0 到 S5 六个状态和 A1 重试分支，每个状态写明玩家行为、系统动作和 NPC 台词',size:'narrow'},
      {src:'assets/projects/elf/elf_card_06.webp',tag:'DEVELOPMENT',title:'Key Scripts',info:'开发｜HitStreakManager 关键行',desc:'连击管理器的三段关键代码。RegisterHit 里：连击等于 3 且挂了 Streak3 触发器，就打印日志并调用 InvokeSelectedTrigger()；连击等于 5 同理走 Streak5。RegisterMiss 带一个原因参数：连击大于 0 且挂了 Broken 触发器时，先记下重置前的连击数，再触发 Broken；最后连击归零，标记已发送。Update 里判断：已经发送过中断、连击大于 0、且距离上次命中超过 missTimeout，就以 gaze_timeout 为原因调用 RegisterMiss。',alt:'HitStreakManager 的关键代码：RegisterHit、RegisterMiss 和 Update 三段，白底黑字',size:'narrow'},
      {src:'assets/projects/elf/elf_card_07.webp',tag:'DEVELOPMENT',title:'Voice Input',info:'开发｜让玩家直接开口说话',desc:'为了让玩家不用按键也能和 Jin 对话，做了两处改动。一是麦克风权限：Android 下启动时检查，没有授权就申请麦克风权限。二是把按键说话改掉：Actions 列表里 Talk 绑定到键盘 T、左右手柄的 triggerPressed 和 Oculus Touch Controller，并让 ConvAI 进入对话模式。这样玩家在训练过程中随时能开口，Jin 按人设里的规则回应。',alt:'麦克风权限脚本 MicPermissionRequester，以及 Actions 列表里 Talk 的按键绑定',size:'narrow'},
      {src:'assets/projects/elf/elf_card_08.webp',tag:'DEMO',title:'Eye Tracking Scene & Build Demo',info:'开发与实录｜眼动场景与实机画面',desc:'上面是 Unity 里的眼动场景 EyeTracking_MinimalScene：把左右眼注视合成一个 CyclopsGazePose，由 EyeGazeRayOriginDriver 发出注视射线，另配注视稳定化、可视化和舒适度管理组件。下面是实机录屏的三帧：第一视角躺在床上，房间墙面画着彩色的树和太阳纹样，远处有一扇拱门；白色光球是训练目标，按节拍在不同位置出现，玩家用注视去追。',alt:'Unity 编辑器里的眼动场景层级列表和场景视图，下方是实机录屏三帧：卧室场景的第一视角，白色光球出现在画面不同位置'}
    ]
  },
  qm01:{

    category:'AI IN-GAME ASSISTANT · HTML / CSS / JAVASCRIPT · AI CODING / 2026',
    title_1:'QM-01', title_2:'AI 战术后勤助手',
    intro:'QM-01 是搜打撤游戏里的资源管理助手。仓库爆满、想卡着预算配装时，玩家不用再逐件查看、拖拽和比价，说一句话，助手给出方案清单，确认后才执行。意图由规则引擎解析，另留了兼容大模型的接口；计算、校验和修改库存都由代码完成。',
    tags:['NATURAL LANGUAGE','RULE ENGINE','WEB PROTOTYPE','PLAYER CONFIRMATION'],
    link:{href:'qm01/index.html',label:'打开可运行原型 ↗'},
    stats:[{num:'8 类意图',label:'INTENT TYPES'},{num:'60 / 60',label:'INTENT RECOGNIZED'},{num:'9 类异常处理',label:'EXCEPTION TYPES'}],
    hero:'assets/projects/qm01/qm01_hero.mp4',
    hero_poster:'assets/projects/qm01/qm01_hero_poster.webp',
    hero_alt:'QM-01 网页原型演示录屏：战前仓库界面，左侧干员与装备，右侧仓库网格，助手面板里展开着配装的规划过程',
    filter_title:'说出目标，它出方案，卖不卖你来定',
    filter_intro:'按“概念—对话—AI Coding—演示”组织：01 两个痛点故事板，02 从一句话到执行确认，03 三条核心指令，04 九类异常与容错，05 与编码 Agent 协作的过程，06、07 语言、规则与布局的 Debug 记录，08 运行中的网页原型。',
    filters:['CONCEPT','DIALOGUE','AI CODING','DEMO'],
    cards:[
      {src:'assets/projects/qm01/qm01_card_01.webp',tag:'CONCEPT',title:'Two Pains',info:'概念｜仓库爆满与低成本配装',desc:'两个场景各三格分镜。场景一，仓库爆满、队友催促：小 A 满载而归却放不下，「好不容易带出来的，怎么没地方放了」；队友语音催他快准备下一把；他只能逐个处理，「这个要不要留？算了，先卖几个腾地方」，看、犹豫、出售、确认反复循环，迟迟开不了局。场景二，想省钱、快速出发：他找值钱的卖掉换装备，边比价边配，既怕误卖又担心着急卖错；时间不够，只看总值不看细节，最后胡乱抓几件，想带的不一定带得上。痛点分别是：收纳被空间限制打断、时间压力叠加去留决策、重复操作打断组队节奏；以及钱不够用、缺资源、配装取舍费时、低预算易配错。',alt:'六格痛点分镜：上排是仓库爆满、队友催促的三格（放不下、被催、逐个查看出售），下排是想省钱快速出发的三格（卖值钱的换装备、边比价边配、胡乱抓几件），每格下方有说明和痛点标注'},
      {src:'assets/projects/qm01/qm01_card_02.webp',tag:'DIALOGUE',title:'Goal to Execution',info:'对话｜从一句话到执行',desc:'完整链路是：表达目标 → 解析 → 规则校验 → 方案预览 → 确认 → 执行。左上是助手入口，输入框旁放着三条快捷指令；右上是出售清单，标着「SELL BLUE · 不可撤销」，每件物品列出本身价、交易行价、手续费和每堆净收益，并注明挂行还是直接出售；底部汇总直接出售 2 堆 6,400、挂交易行 9 堆 69,065，总预计收益 75,465，红字提醒确认后不可撤销、挂单未成交不代表已到账，不点「确认出售」就不会动库存；左下是配装结果，方案已一键穿戴，单击可拖拽替换，点右下角可撤销；右下是模型接入设置，可以填 Base URL、API Key 和模型 ID。规则是：出售不可撤销，必须玩家确认；配装可撤销。原型截图录制时接入了模型，所以回复开头带有「LLM 理解」字样，未接入模型时这一步由本地规则引擎完成。',alt:'四张原型截图：带三条快捷指令的助手入口、列出价格和预计收入的出售清单、带撤销按钮的配装结果、模型接入设置面板',size:'narrow'},
      {src:'assets/projects/qm01/qm01_card_03.webp',tag:'DIALOGUE',title:'Three Core Commands',info:'对话｜三条核心指令',desc:'三条指令对应出售、起装和转移三类目标。指令一，「帮我卖掉所有蓝色物品」：仓库内蓝色物品共 11 件，9 件挂交易行（预计净收益 72,675，扣手续费后仍更划算），2 件直接出售（即时到账 6,400），已跳过 1 件带入局物资。规划过程分三步：只筛仓库内精确蓝色，不含白绿，也不含装备栏与其他容器；逐堆比价，挂行净价高于本身价则挂行，否则直接出售；挂行只模拟挂单、收益不到账，直接卖即时到账，本操作不可撤销。指令二，「帮我起一套十万左右的装备」：按预算 100,000 取达标方案里最接近目标的一套，战术头盔、三级防弹甲、D3 胸挂、Lk 战术背包、AKMN 突击步枪、AKM 突击步枪，合计战备价值 100,600，仅高出 600，可一键穿戴或换一套；穿戴后单击可拖拽替换，点右下角可撤销。指令三，「带入对局的高级子弹和甲修放保险」：高级子弹 1 排（.44 马格南弹）加甲修（高级护甲维修包），共 2 件、新增占用 3 格，剩余 3/6 格；死亡也不掉落，可一键撤销。',alt:'三张原型截图：卖蓝色物品的对话与三步规划过程、十万左右配装的装备清单与一键穿戴结果、高级子弹和甲修放进安全箱的对话及左侧安全箱',size:'narrow'},

/* 从 DATA 列表里找该项目的名称：按 href:"#ID" 或 pid:"ID" 匹配 */
function csProjectListName(id){
  const parents = (PROJECTS[id] && PROJECTS[id].parent) || [];
  for(const cat of parents){
    const list = (DATA[cat] && DATA[cat].projects) || [];
    const hit = list.find(x=>x.href === '#'+id || x.pid === id);
    if(hit) return String(hit.zh || hit.en || '').trim();
  }
  return '';
}
function renderProject(id){
  const P = PROJECTS[id] || {};
  const pick = (v,def)=>esc(v != null && v !== '' ? v : def);
  const at = (arr,i)=>Array.isArray(arr) ? arr[i] : undefined;

  const renderCards = (cardList, start)=>{

    const placeholderAttrs = c.src ? '' : ' role="img" aria-label="'+pick(c.alt,'图片占位')+'"';
    return '<article class="'+cls+'">'+

      '</article>';
    }).join('');
  };
  const cards = renderCards(list, 1);
  /* 第二板块（可选）：P.extra = { id, title, intro, tags[], cards[] }，编号接着主板块排 */
  const ex = P.extra && Array.isArray(P.extra.cards) && P.extra.cards.length ? P.extra : null;

        '<div class="cs-tags">'+(ex.tags || []).slice(0,6).map(t=>'<span class="cs-tag">'+esc(t)+'</span>').join('')+'</div>'+
      '</section>'+
      '<section class="cs-cards cs-cards--extra"><div class="cs-grid">'+renderCards(ex.cards, list.length+1)+'</div></section>'
    : '';
  const pills = [0,1,2].map(i=>'<span class="cs-pill">'+pick(at(P.tags,i),'标签')+'</span>').join('');
  /* 可选外链：P.link = { href, label }，跟在首屏胶囊后面，新标签打开 */
  const link = (P.link && P.link.href)
    ? '<a class="cs-pill cs-pill--link" href="'+esc(P.link.href)+'" target="_blank" rel="noopener">'+pick(P.link.label,'打开原型')+'</a>'

  const stats = [0,1,2].map(i=>{

    return '<div class="cs-stat"><b>'+pick(st.num,'数据')+'</b><span>'+pick(st.label,'项目信息')+'</span></div>';

  const filters = [0,1,2,3,4,5].map(i=>'<span class="cs-tag">'+pick(at(P.filters,i),'分类')+'</span>').join('');
  return '<div class="cs-wrap" data-no-amp>'+

      '<div class="cs-tags">'+filters+'</div>'+

    extraSection+
    '<section class="cs-contact"><a class="cs-tag" href="#about" data-cs-contact>联系我</a></section>'+

/* 固定两层预览与独立指针提示：仅当前分类缓存，封面解码后切换。 */
const projectPreview = (()=>{
  let dispose = null;
  function destroy(){ if(dispose){ dispose(); dispose = null; } }
  function setup(list){
    destroy();
    if(!list || !PREVIEW_CATEGORIES.has(list.dataset.category)) return;
    const fine = matchMedia('(hover:hover) and (pointer:fine)');
    const reduced = matchMedia('(prefers-reduced-motion:reduce)');
    const events = new AbortController();
    const cache = new Map();
    const layer = document.createElement('div');
    layer.className = 'project-preview';
    layer.setAttribute('aria-hidden','true');
    const slides = [0,1].map(()=>{
      const slide = document.createElement('div');
      slide.className = 'project-preview__slide';
      const image = document.createElement('img');
      image.alt = ''; image.className = 'project-preview__image'; image.decoding = 'async';
      slide.appendChild(image); layer.appendChild(slide);
      return {node:slide,image};
    });
    const view = document.createElement('span');
    view.className = 'project-preview__view'; view.textContent = 'view';
    view.setAttribute('aria-hidden','true');
    document.body.append(layer,view);
    const style = getComputedStyle(layer);
    const slideDuration = parseFloat(style.getPropertyValue('--preview-slide-duration'));
    const slideEase = style.getPropertyValue('--preview-ease').trim();
    let current = null, presented = null, cursorRow = null, active = 0;
    let ticket = 0, swap = 0, animations = [], frame = 0, alive = true, size = 0;
    let pointerX = 0, pointerY = 0, x = 0, y = 0, lastTime = 0;
    function updateView(){
      view.style.transform = 'translate3d('+(pointerX-34)+'px,'+(pointerY-34)+'px,0)';
    }
    function clearView(){
      if(cursorRow) cursorRow.classList.remove('has-preview-cursor');
      cursorRow = null; view.classList.remove('is-visible');
    }
    function settleSwap(){
      swap++;
      animations.forEach(animation=>animation.cancel()); animations = [];
      slides.forEach((slide,index)=>{
        slide.node.classList.toggle('is-active',index===active);
        slide.node.style.transform = 'translateY(0)';
      });
    }
    function hide(clear=false){
      ticket++; current = null; presented = null;
      clearView(); settleSwap();
      cancelAnimationFrame(frame); frame = 0;
      layer.classList.remove('is-visible');
      if(clear) slides.forEach(slide=>{
        slide.node.classList.remove('is-active'); slide.image.removeAttribute('src');
      });
    }
    function target(){
      return {
        x:Math.max(16,Math.min(pointerX+24,window.innerWidth-size-16)),
        y:Math.max(16,Math.min(pointerY-size-24,window.innerHeight-size-16))
      };
    }
    function tick(time){
      if(!alive || !current || !layer.classList.contains('is-visible')){ frame = 0; return; }
      const point = target();
      const amount = reduced.matches ? 1 : 1-Math.pow(.82,Math.min(64,time-lastTime)/16.67);
      x += (point.x-x)*amount; y += (point.y-y)*amount; lastTime = time;
      layer.style.transform = 'translate3d('+x+'px,'+y+'px,0)';
      frame = requestAnimationFrame(tick);
    }
    function imageFor(src){
      if(cache.has(src)) return cache.get(src);
      const promise = new Promise(resolve=>{
        const image = new Image();
        image.alt = ''; image.className = 'project-preview__image'; image.decoding = 'async';
        image.onload = async()=>{
          try{ if(image.decode) await image.decode(); resolve(image); }
          catch(err){ resolve(null); }
        };
        image.onerror = ()=>resolve(null);
        image.src = src;
      });
      cache.set(src,promise);
      return promise;
    }
    async function enter(row){
      if(row===current) return;
      const stamp = ++ticket;
      current = row; clearView(); settleSwap();
      if(!fine.matches || !row){ hide(true); return; }
      const src = localProjectPreview(row.dataset.preview);
      if(!src){ hide(true); return; }
      const image = await imageFor(src);
      if(!alive || stamp!==ticket || current!==row || !row.isConnected || !fine.matches) return;
      if(!image){ hide(true); return; }
      const previous = presented;
      const changing = previous && previous!==row;
      const old = active;
      active = changing ? 1-active : active;
      slides[active].image.src = src;
      slides[active].node.classList.add('is-active');
      presented = row;
      if(changing && !reduced.matches){
        const rows = Array.from(list.querySelectorAll('.prow'));
        const direction = rows.indexOf(previous)<rows.indexOf(row) ? 1 : -1;
        const generation = ++swap;
        const options = {duration:slideDuration,easing:slideEase};
        animations = [
          slides[old].node.animate([{transform:'translateY(0)'},{transform:'translateY('+(-direction*100)+'%)'}],options),
          slides[active].node.animate([{transform:'translateY('+(direction*100)+'%)'},{transform:'translateY(0)'}],options)
        ];
        Promise.all(animations.map(animation=>animation.finished)).then(()=>{
          if(alive && generation===swap) settleSwap();
        }).catch(()=>{});
      }else{
        settleSwap();
      }
      if(!previous){
        size = layer.getBoundingClientRect().width;
        const point = target(); x = point.x; y = point.y;
        layer.style.transform = 'translate3d('+x+'px,'+y+'px,0)';
      }
      layer.classList.add('is-visible');
      updateView(); view.classList.add('is-visible');
      cursorRow = row; cursorRow.classList.add('has-preview-cursor');
      if(!frame){ lastTime = performance.now(); frame = requestAnimationFrame(tick); }
    }
    const signal = events.signal;
    list.addEventListener('pointerover',event=>{
      if(event.pointerType==='touch') return;
      pointerX = event.clientX; pointerY = event.clientY;
      const row = event.target.closest('.prow');
      if(row && list.contains(row)) enter(row);
      else hide();
    },{signal});
    list.addEventListener('pointermove',event=>{
      if(event.pointerType==='touch') return;
      pointerX = event.clientX; pointerY = event.clientY;
      if(cursorRow) updateView();
    },{signal,passive:true});
    list.addEventListener('pointerleave',()=>hide(),{signal});
    list.addEventListener('keydown',event=>{
      const row = event.target.closest('.prow');
      if(row && list.contains(row) && (event.key==='Enter' || event.key===' ')){
        event.preventDefault();
        if(!event.repeat) row.click();
      }
    },{signal});
    window.addEventListener('scroll',()=>hide(),{capture:true,passive:true,signal});
    window.addEventListener('resize',()=>hide(),{passive:true,signal});
    const mediaChange = ()=>hide(true);
    fine.addEventListener('change',mediaChange);
    reduced.addEventListener('change',mediaChange);
    dispose = ()=>{
      alive = false; hide(true); events.abort(); cache.clear();
      fine.removeEventListener('change',mediaChange);
      reduced.removeEventListener('change',mediaChange);
      layer.remove(); view.remove();
    };
  }
  window.addEventListener('pagehide',destroy);
  window.addEventListener('pageshow',event=>{
    if(event.persisted) setup(document.querySelector('.page.active .plist--preview'));
  });
  return {setup,destroy};
})();

/* ================= 个人 IP 九方向姿态控制（二维鼠标映射） ================= */
const IP_CONFIG = {
  debug: new URLSearchParams(location.search).get("ipdebug") === "1",
  head:{ cx:705, cy:160, rx:250, ry:140 },
  srcDir:"assets/video/ip-nine",
  sourceWidth:1440,
  sourceHeight:1080
};
const IP_NINE = {
  "left-up":"0119",
  "center-up":"0055",
  "right-up":"0064",
  "left-center":"0111",
  "center-center":"0000",
  "right-center":"0068",
  "left-down":"0104",
  "center-down":"0099",
  "right-down":"0089"
};
const IP_POSE_NAMES = {
  "left-up":"左上",
  "center-up":"正上",
  "right-up":"右上",
  "left-center":"正左",
  "center-center":"正面",
  "right-center":"正右",
  "left-down":"左下",
  "center-down":"正下",
  "right-down":"右下"
};
let ipRafPending = false;
let ipReady = false;
let ipPreloadPromise = null;
let ipLastPoseId = "";
let ipLastPoint = null;
let ipViewportObserver = null;
const IP_FADE_MS = 150;
const IP_FOLLOW_FADE = false; /* 鼠标跟随九宫格换图是否也淡入淡出；false=保持原来的直接切换 */
let ipBubbleDir = null;       /* 气泡锁定的方位（IP_NINE 的键），null=未锁定 */
let ipBubbleObserver = null;

/* 统一换图：fade 时用叠放的第二层图片显示旧姿态并淡出，不改变 IP 尺寸、位置和占位 */
function ipShowPose(poseId, key, fade){
  const img = document.getElementById("ip-pose");
  if(!img || !poseId || poseId === ipLastPoseId) return;
  const stage = img.parentNode;
  let ghost = document.getElementById("ip-pose-fade");
  if(fade && !REDUCED){
    if(!ghost){
      ghost = document.createElement("img");
      ghost.id = "ip-pose-fade";
      ghost.alt = "";
      ghost.setAttribute("aria-hidden","true");
      ghost.style.pointerEvents = "none";
      ghost.style.opacity = "0";
      stage.insertBefore(ghost, img.nextSibling);
    }
    ghost.style.transition = "none";
    ghost.src = ipPosePath(ipLastPoseId || "0000");
    ghost.style.opacity = "1";
    void ghost.offsetWidth;
    ghost.style.transition = "opacity " + IP_FADE_MS + "ms linear";
    ghost.style.opacity = "0";
  } else if(ghost){
    ghost.style.transition = "none";
    ghost.style.opacity = "0";
  }
  ipLastPoseId = poseId;
  img.src = ipPosePath(poseId);
  img.alt = (IP_POSE_NAMES[key] || "") + "姿态";
}

/* 气泡展开(悬停/聚焦/触屏点击)时锁定方位；全部关闭后恢复鼠标跟随，触屏回正面 */
function ipSyncBubbleDir(layer){
  if(ipStyleCollapsed) return;
  const open = layer.querySelector(".ip-bubble.open");
  const dir = open && IP_NINE[open.dataset.dir] ? open.dataset.dir : null;
  if(dir === ipBubbleDir) return;
  ipBubbleDir = dir;
  if(dir){ ipShowPose(IP_NINE[dir], dir, true); return; }
  if(HOVER_DEVICE && ipReady && ipLastPoint) updateIpPose(ipLastPoint.x, ipLastPoint.y, true);
  else ipShowPose("0000", "center-center", true);
}

function ipPosePath(id){
  return IP_CONFIG.srcDir + "/" + id + ".webp";
}

function preloadIpPoses(){
  if(ipPreloadPromise) return ipPreloadPromise;
  ipPreloadPromise = Promise.all(Object.values(IP_NINE).map(id=>{
    return new Promise(resolve=>{
      const img = new Image();
      img.decoding = "async";
      img.onload = ()=>img.decode().then(resolve,resolve);
      img.onerror = resolve;
      img.src = ipPosePath(id);
    });
  })).then(()=>{
    ipReady = true;
    if(ipLastPoint){
      const p = ipLastPoint;
      scheduleIpPoseUpdate(p.x, p.y);
    }
  });
  return ipPreloadPromise;
}

function clamp01(v){
  return Math.max(-1, Math.min(1, v));
}

function getContainRect(stageRect, mediaW, mediaH){
  const stageRatio = stageRect.width / stageRect.height;
  const mediaRatio = mediaW / mediaH;
  let left, top, width, height;
  if(mediaRatio > stageRatio){
    width = stageRect.width;
    height = stageRect.width / mediaRatio;
    left = stageRect.left;
    top = stageRect.top + (stageRect.height - height) / 2;
  } else {
    height = stageRect.height;
    width = stageRect.height * mediaRatio;
    left = stageRect.left + (stageRect.width - width) / 2;
    top = stageRect.top;
  }
  return {left, top, width, height, scaleX:width/mediaW, scaleY:height/mediaH};
}

function ipChooseBucket(v, boundary){
  if(v < -boundary) return "left";
  if(v > boundary) return "right";
  return "center";
}

function updateIpPose(clientX, clientY, fade){
  if(ipBubbleDir) return;
  if(!ipReady || document.getElementById("wechat-dialog")?.open) return;
  const stage = document.getElementById("ip-stage");
  const img = document.getElementById("ip-pose");
  if(!stage || !img) return;
  const stageRect = stage.getBoundingClientRect();
  if(stageRect.width <= 0 || stageRect.height <= 0) return;
  const mediaW = img.naturalWidth || IP_CONFIG.sourceWidth;
  const mediaH = img.naturalHeight || IP_CONFIG.sourceHeight;
  const display = getContainRect(stageRect, mediaW, mediaH);
  const head = IP_CONFIG.head;
  const screenCx = display.left + head.cx * display.scaleX;
  const screenCy = display.top + head.cy * display.scaleY;
  const screenRx = head.rx * display.scaleX;
  const screenRy = head.ry * display.scaleY;
  if(screenRx <= 0 || screenRy <= 0) return;

  const x = clamp01((clientX - screenCx) / screenRx);
  const y = clamp01((clientY - screenCy) / screenRy);
  const h = x < -1/3 ? "left" : (x > 1/3 ? "right" : "center");
  const v = y < -1/3 ? "up" : (y > 1/3 ? "down" : "center");
  const key = h + "-" + v;
  const poseId = IP_NINE[key];
  if(!poseId) return;

  ipShowPose(poseId, key, fade === true || IP_FOLLOW_FADE);
  updateIpDebug(x, y, h, v, poseId, key, stageRect, display);
}

function scheduleIpPoseUpdate(clientX, clientY){
  if(ipRafPending) return;
  ipRafPending = true;
  requestAnimationFrame(()=>{
    ipRafPending = false;
    if(ipLastPoint) updateIpPose(ipLastPoint.x, ipLastPoint.y);
  });
}

function handleIpPointer(e){
  if(!pageView.classList.contains("active")) return;
  if((location.hash.replace("#","") || "home") !== "about") return;
  if(!HOVER_DEVICE || document.getElementById("wechat-dialog")?.open) return;
  if(ipStyleCollapsed) return;
  ipLastPoint = {x:e.clientX, y:e.clientY};
  scheduleIpPoseUpdate(e.clientX, e.clientY);
}

function handleIpGeometryChange(){
  if(ipLastPoint) scheduleIpPoseUpdate(ipLastPoint.x, ipLastPoint.y);
}
window.addEventListener("resize", handleIpGeometryChange);
window.addEventListener("scroll", handleIpGeometryChange, {passive:true});

function updateIpDebug(x, y, h, v, poseId, key, stageRect, display){
  if(!IP_CONFIG.debug) return;
  const head = IP_CONFIG.head;
  const screenCx = display.left + head.cx * display.scaleX;
  const screenCy = display.top + head.cy * display.scaleY;
  const screenRx = head.rx * display.scaleX;
  const screenRy = head.ry * display.scaleY;
  const box = document.getElementById("ip-debug-box");
  if(box){
    box.style.left = (screenCx - screenRx - stageRect.left) + "px";
    box.style.top = (screenCy - screenRy - stageRect.top) + "px";
    box.style.width = (screenRx * 2) + "px";
    box.style.height = (screenRy * 2) + "px";
  }
  const info = document.getElementById("ip-debug-info");
  if(info){
    info.textContent = "X " + x.toFixed(2) + "  /  Y " + y.toFixed(2) +
      "  /  " + key + "  " + IP_POSE_NAMES[key] +
      "  /  个人 IP 视频素材" + poseId + ".png";
  }
}

function initIpPose(){
  const stage = document.getElementById("ip-stage");
  const img = document.getElementById("ip-pose");
  if(!stage || !img) return false;
  pageView.classList.toggle("ip-debug", IP_CONFIG.debug);
  ipLastPoseId = "0000";
  ipBubbleDir = null;
  img.src = ipPosePath("0000");
  img.decoding = "async";
  ipLastPoint = null;
  if(typeof IntersectionObserver !== "undefined"){
    if(ipViewportObserver) ipViewportObserver.disconnect();
    ipViewportObserver = new IntersectionObserver(entries=>{
      if(entries.some(entry=>entry.isIntersecting)){
        preloadIpPoses();
        if(ipViewportObserver) ipViewportObserver.disconnect();
        ipViewportObserver = null;
      }
    }, {rootMargin:"420px 0px"});
    ipViewportObserver.observe(stage);
  } else {
    preloadIpPoses();
  }
  return true;
}

function setPersonaBubbleVisual(record, open){
  if(open && !record.open) placePersonaBubbleCard(record);
  record.open = open;
  record.item.classList.toggle("open",open);
  record.button.setAttribute("aria-expanded",String(open));
  record.card.setAttribute("aria-hidden",String(!open));
}

function clearPersonaBubbleState(record){
  record.hover = false;
  record.focus = false;
  record.pinned = false;
  setPersonaBubbleVisual(record,false);
}

function syncPersonaBubble(record){
  const shouldOpen = record.hover || record.focus || record.pinned;
  if(shouldOpen){
    personaBubbleRecords.forEach(other=>{
      if(other !== record && other.open) clearPersonaBubbleState(other);
    });
  }
  setPersonaBubbleVisual(record,shouldOpen);
}

function closeAllPersonaBubbles(blurActive=false){
  if(blurActive && document.activeElement?.closest?.(".ip-bubble")){
    document.activeElement.blur();
  }
  personaBubbleRecords.forEach(clearPersonaBubbleState);
}

function personaBubbleIntersects(a,b,pad=0){
  return !(a.right + pad <= b.left || a.left >= b.right + pad ||
    a.bottom + pad <= b.top || a.top >= b.bottom + pad);
}

function getPersonaBubbleGeometry(){
  const layer = document.getElementById("ip-bubbles");
  if(!layer) return null;
  const width = layer.clientWidth;
  const height = layer.clientHeight;
  if(!width || !height) return null;
  const mobile = window.matchMedia("(max-width:1000px)").matches;
  const layerRect = layer.getBoundingClientRect();
  const horizontalLeft = -layerRect.left;
  const horizontalRight = document.documentElement.clientWidth - layerRect.left;
  let safe = {
    left:width * .33,
    top:height * -.02,
    right:width * .66,
    bottom:height * 1.03
  };
  safe.width = safe.right - safe.left;
  safe.height = safe.bottom - safe.top;
  const stage = document.getElementById("ip-stage");
  const figure = document.getElementById("ip-pose");
  if(stage && figure){
    const stageRect = stage.getBoundingClientRect();
    const mediaW = figure.naturalWidth || IP_CONFIG.sourceWidth;
    const mediaH = figure.naturalHeight || IP_CONFIG.sourceHeight;
    const display = getContainRect(stageRect,mediaW,mediaH);
    const padding = mobile
      ? Math.min(PERSONA_BUBBLE_CONFIG.figurePadding.mobileMax,Math.max(PERSONA_BUBBLE_CONFIG.figurePadding.mobileMin,document.documentElement.clientWidth * .1))
      : PERSONA_BUBBLE_CONFIG.figurePadding.desktop;
    const box = PERSONA_BUBBLE_CONFIG.figureBox;
    const left = display.left + box.left * display.scaleX - padding - layerRect.left;
    const right = display.left + box.right * display.scaleX + padding - layerRect.left;
    const top = display.top + box.top * display.scaleY - padding - layerRect.top;
    const bottom = display.top + box.bottom * display.scaleY + padding - layerRect.top;
    safe = {left,top,right,bottom,width:right - left,height:bottom - top};
  }
  return {
    layer,width,height,safe,
    mobile,
    safeGap:mobile ? 2 : 10,
    bounds:{
      left:horizontalLeft + PERSONA_BUBBLE_CONFIG.edge,
      top:PERSONA_BUBBLE_CONFIG.edge,
      right:horizontalRight - PERSONA_BUBBLE_CONFIG.edge,
      bottom:height - PERSONA_BUBBLE_CONFIG.edge
    },
    anchorBounds:{left:0,top:0,right:width,bottom:height}
  };
}

function resolvePersonaBubbleAnchor(record, geometry){
  const bubble = record.data;
  const preferredX = geometry.mobile && Number.isFinite(bubble.mx) ? bubble.mx : bubble.x;
  const preferredY = geometry.mobile && Number.isFinite(bubble.my) ? bubble.my : bubble.y;
  const hitW = record.button.offsetWidth || 64;
  const hitH = record.button.offsetHeight || 64;
  const halfW = hitW / 2;
  const halfH = hitH / 2;
  const iconW = record.iconMotion.offsetWidth || 56;
  const iconH = record.iconMotion.offsetHeight || 56;
  const iconHalfW = iconW / 2;
  const iconHalfH = iconH / 2;
  let cx = preferredX / 100 * geometry.width;
  let cy = preferredY / 100 * geometry.height;
  cx = Math.max(geometry.anchorBounds.left + halfW,Math.min(geometry.anchorBounds.right - halfW,cx));
  cy = Math.max(geometry.anchorBounds.top + halfH,Math.min(geometry.anchorBounds.bottom - halfH,cy));

  const iconRect = {left:cx - iconHalfW,right:cx + iconHalfW,top:cy - iconHalfH,bottom:cy + iconHalfH};
  if(personaBubbleIntersects(iconRect,geometry.safe,geometry.safeGap)){
    const safeCenter = geometry.safe.left + geometry.safe.width / 2;
    if(cx <= safeCenter){
      cx = Math.min(cx,geometry.safe.left - iconHalfW - geometry.safeGap);
    } else {
      cx = Math.max(cx,geometry.safe.right + iconHalfW + geometry.safeGap);
    }
    cx = Math.max(geometry.anchorBounds.left + halfW,Math.min(geometry.anchorBounds.right - halfW,cx));
  }

  record.cx = cx;
  record.cy = cy;
  record.halfW = halfW;
  record.halfH = halfH;
  record.preferredX = preferredX;
  record.preferredY = preferredY;
  record.geometry = geometry;
  record.item.style.setProperty("--bx",(cx / geometry.width * 100).toFixed(3) + "%");
  record.item.style.setProperty("--by",(cy / geometry.height * 100).toFixed(3) + "%");
  const baseFloat = parseFloat(bubble.float) || 6;
  const floatValue = geometry.mobile ? Math.max(2,Math.min(3.5,baseFloat * .55)) : baseFloat;
  record.item.style.setProperty("--float",floatValue.toFixed(2) + "px");
  record.range.style.width = hitW + "px";
  record.range.style.height = hitH + "px";
  const actualX = Math.round(cx / geometry.width * 100);
  const actualY = Math.round(cy / geometry.height * 100);
  record.range.dataset.side = cx < geometry.width / 2 ? "left" : "right";
  record.range.dataset.label = String(record.index + 1).padStart(2,"0") +
    " · " + preferredX + "/" + preferredY + " → " + actualX + "/" + actualY;
}

function getPersonaBubbleSide(record){
  const {safe} = record.geometry;
  if(record.cx < safe.left) return "left";
  if(record.cx > safe.right) return "right";
  if(record.cy < safe.top) return "up";
  if(record.cy > safe.bottom) return "down";
  return record.cx < safe.left + safe.width / 2 ? "left" : "right";
}

function makePersonaCardRect(record, direction, cardW, cardH){
  const gap = PERSONA_BUBBLE_CONFIG.gap;
  let x = 0;
  let y = 0;
  if(direction === "left"){
    x = record.cx - record.halfW - gap - cardW;
    y = record.cy - cardH / 2;
  } else if(direction === "right"){
    x = record.cx + record.halfW + gap;
    y = record.cy - cardH / 2;
  } else if(direction === "up"){
    x = record.cx - cardW / 2;
    y = record.cy - record.halfH - gap - cardH;
  } else {
    x = record.cx - cardW / 2;
    y = record.cy + record.halfH + gap;
  }
  return {left:x,top:y,right:x + cardW,bottom:y + cardH,width:cardW,height:cardH,direction};
}

function fitPersonaCardRect(record, rect, geometry){
  const bounds = geometry.bounds;
  const obstacles = personaBubbleRecords.map(item=>({
    left:item.cx - item.halfW,
    right:item.cx + item.halfW,
    top:item.cy - item.halfH,
    bottom:item.cy + item.halfH
  }));
  const iconGap = PERSONA_BUBBLE_CONFIG.gap - 3;
  if(rect.direction === "left" || rect.direction === "right"){
    const verticalHits = obstacles.filter(item=>
      rect.top < item.bottom + iconGap && rect.bottom > item.top - iconGap
    );
    if(verticalHits.length){
      if(rect.direction === "left"){
        const rightLimit = Math.min(...verticalHits.map(item=>item.left)) - iconGap;
        rect.right = Math.min(rect.right,rightLimit);
        rect.left = rect.right - rect.width;
      } else {
        const leftLimit = Math.max(...verticalHits.map(item=>item.right)) + iconGap;
        rect.left = Math.max(rect.left,leftLimit);
        rect.right = rect.left + rect.width;
      }
    }
    if(rect.left < bounds.left || rect.right > bounds.right) return null;
    rect.top = Math.max(bounds.top,Math.min(bounds.bottom - rect.height,rect.top));
    rect.bottom = rect.top + rect.height;
  } else {
    if(rect.top < bounds.top || rect.bottom > bounds.bottom) return null;
    rect.left = Math.max(bounds.left,Math.min(bounds.right - rect.width,rect.left));
    rect.right = rect.left + rect.width;
    if(personaBubbleIntersects(rect,geometry.safe,geometry.safeGap)){
      const safeCenter = geometry.safe.left + geometry.safe.width / 2;
      if(rect.left + rect.width / 2 < safeCenter){
        rect.left = geometry.safe.left - rect.width - geometry.safeGap;
      } else {
        rect.left = geometry.safe.right + geometry.safeGap;
      }
      rect.right = rect.left + rect.width;
      if(rect.left < bounds.left || rect.right > bounds.right) return null;
    }
  }

  const iconRect = {left:record.cx - record.halfW,right:record.cx + record.halfW,top:record.cy - record.halfH,bottom:record.cy + record.halfH};
  if(personaBubbleIntersects(rect,iconRect,iconGap)) return null;
  if(obstacles.some(item=>personaBubbleIntersects(rect,item,4))) return null;
  if(personaBubbleIntersects(rect,geometry.safe,geometry.safeGap)) return null;
  return rect;
}

function placePersonaBubbleCard(record){
  const geometry = record.geometry || getPersonaBubbleGeometry();
  if(!geometry || !record.card.offsetWidth) return;
  record.geometry = geometry;
  const cardW = record.card.offsetWidth;
  const cardH = record.card.offsetHeight;
  const side = getPersonaBubbleSide(record);
  const order = side === "left"
    ? ["left","up","down"]
    : side === "right"
      ? ["right","up","down"]
      : side === "up"
        ? ["up","left","right"]
        : ["down","left","right"];
  let rect = null;
  for(const direction of order){
    const candidate = fitPersonaCardRect(record,makePersonaCardRect(record,direction,cardW,cardH),geometry);
    if(candidate){
      rect = candidate;
      break;
    }
  }

  if(!rect){
    const preferredSide = record.cx < geometry.safe.left + geometry.safe.width / 2 ? "left" : "right";
    let left = preferredSide === "left" ? geometry.bounds.left : geometry.bounds.right - cardW;
    let top = Math.max(geometry.bounds.top,Math.min(geometry.bounds.bottom - cardH,record.cy - cardH / 2));
    rect = {left,top,right:left + cardW,bottom:top + cardH,width:cardW,height:cardH,direction:preferredSide};
    if(personaBubbleIntersects(rect,{left:record.cx - record.halfW,right:record.cx + record.halfW,top:record.cy - record.halfH,bottom:record.cy + record.halfH},0)){
      const above = record.cy - record.halfH - PERSONA_BUBBLE_CONFIG.gap - cardH;
      const below = record.cy + record.halfH + PERSONA_BUBBLE_CONFIG.gap;
      top = above >= geometry.bounds.top ? above : below;
      top = Math.max(geometry.bounds.top,Math.min(geometry.bounds.bottom - cardH,top));
      rect.top = top;
      rect.bottom = top + cardH;
    }
    if(personaBubbleIntersects(rect,geometry.safe,geometry.safeGap)){
      left = preferredSide === "left" ? geometry.bounds.left : geometry.bounds.right - cardW;
      rect.left = left;
      rect.right = left + cardW;
    }
  }

  const entry = {
    left:{enterX:16,enterY:0,originX:"100%",originY:"50%"},
    right:{enterX:-16,enterY:0,originX:"0%",originY:"50%"},
    up:{enterX:0,enterY:14,originX:"50%",originY:"100%"},
    down:{enterX:0,enterY:-14,originX:"50%",originY:"0%"}
  }[rect.direction] || {enterX:0,enterY:0,originX:"50%",originY:"50%"};
  record.item.dataset.direction = rect.direction;
  record.card.style.setProperty("--card-x",(rect.left - record.cx).toFixed(2) + "px");
  record.card.style.setProperty("--card-y",(rect.top - record.cy).toFixed(2) + "px");
  record.card.style.setProperty("--enter-x",entry.enterX + "px");
  record.card.style.setProperty("--enter-y",entry.enterY + "px");
  record.card.style.setProperty("--origin-x",entry.originX);
  record.card.style.setProperty("--origin-y",entry.originY);
}

function layoutPersonaBubbles(){
  const geometry = getPersonaBubbleGeometry();
  if(!geometry) return;
  const safeZone = geometry.layer.querySelector(".ip-safe-zone");
  if(safeZone){
    safeZone.style.setProperty("--safe-x",geometry.safe.left + "px");
    safeZone.style.setProperty("--safe-y",geometry.safe.top + "px");
    safeZone.style.setProperty("--safe-w",geometry.safe.width + "px");
    safeZone.style.setProperty("--safe-h",geometry.safe.height + "px");
  }
  personaBubbleRecords.forEach(record=>resolvePersonaBubbleAnchor(record,geometry));
  personaBubbleRecords.forEach(placePersonaBubbleCard);
}

function schedulePersonaBubbleLayout(){
  if(personaBubbleLayoutRaf) return;
  personaBubbleLayoutRaf = requestAnimationFrame(()=>{
    personaBubbleLayoutRaf = 0;
    layoutPersonaBubbles();
  });
}

function setupPersonaBubbles(){
  const layer = document.getElementById("ip-bubbles");
  if(!layer || !Array.isArray(PROFILE.personaBubbles)) return;
  destroyPersonaBubbles();
  layer.replaceChildren();
  const safeZone = document.createElement("span");
  safeZone.className = "ip-safe-zone";
  safeZone.setAttribute("aria-hidden","true");
  layer.appendChild(safeZone);

  PROFILE.personaBubbles.forEach((b,i)=>{
    const item = document.createElement("article");
    item.id = b.id;
    item.className = "ip-bubble";
    item.dataset.dir = b.dir || ""; /* 气泡对应的 IP 方位，取值为 IP_NINE 的键，可手动改 */
    item.style.setProperty("--bx",b.x + "%");
    item.style.setProperty("--by",b.y + "%");
    item.style.setProperty("--i",String(i));
    item.style.setProperty("--float",b.float);
    item.style.setProperty("--period",b.period);

    const range = document.createElement('span');
    range.className = 'ip-bubble-range';
    range.dataset.label = String(i+1).padStart(2,"0");
    range.setAttribute("aria-hidden","true");

    const rig = document.createElement('div');
    rig.className = 'ip-bubble-rig';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ip-bubble-hit';
    btn.setAttribute('aria-expanded','false');
    btn.setAttribute('aria-label', b.title + '：' + b.desc + ' 展开个人标签。');
    btn.setAttribute('aria-controls', b.id + '-card');

    const iconMotion = document.createElement('span');
    iconMotion.className = 'ip-bubble-icon';
    iconMotion.setAttribute('aria-hidden','true');
    const iconCore = document.createElement('span');
    iconCore.className = 'ip-bubble-icon-core';
    iconCore.appendChild(buildPersonaIcon(b.icon));
    iconMotion.appendChild(iconCore);
    btn.appendChild(iconMotion);
    rig.appendChild(btn);

    const card = document.createElement('div');
    card.id = b.id + '-card';
    card.className = 'ip-bubble-card';
    card.setAttribute('aria-hidden','true');
    const strong = document.createElement('strong');
    strong.textContent = b.title;
    const desc = document.createElement('span');
    desc.textContent = b.desc;
    card.append(strong, desc);
    item.append(range, rig, card);
    layer.appendChild(item);

    const record = {
      id:b.id,index:i,data:b,item,range,button:btn,card,iconMotion,
      hover:false,focus:false,pinned:false,open:false,lastPointerType:""
    };
    personaBubbleRecords.push(record);

    btn.addEventListener('pointerdown', event=>{
      record.lastPointerType = event.pointerType || "";
    });
    btn.addEventListener('pointerenter', event=>{
      if(event.pointerType === 'touch') return;
      record.hover = true;
      syncPersonaBubble(record);
    });
    btn.addEventListener('pointerleave', ()=>{
      record.hover = false;
      syncPersonaBubble(record);
    });
    btn.addEventListener('focus', ()=>{
      record.focus = true;
      syncPersonaBubble(record);
    });
    btn.addEventListener('blur', ()=>{
      record.focus = false;
      syncPersonaBubble(record);
    });
    btn.addEventListener('click', ()=>{
      if(record.lastPointerType === 'touch'){
        record.focus = false;
        record.hover = false;
        record.pinned = !record.pinned;
        syncPersonaBubble(record);
      }
    });
    btn.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
        e.preventDefault();
        record.pinned = true;
        record.focus = true;
        syncPersonaBubble(record);
      } else if(e.key === 'Escape'){
        e.preventDefault();
        clearPersonaBubbleState(record);
        btn.focus({preventScroll:true});
      }
    });
  });

  layoutPersonaBubbles();
  schedulePersonaBubbleLayout();

  if(ipBubbleObserver) ipBubbleObserver.disconnect();
  if(typeof MutationObserver !== 'undefined'){
    ipBubbleObserver = new MutationObserver(()=>ipSyncBubbleDir(layer));
    ipBubbleObserver.observe(layer, {subtree:true, attributes:true, attributeFilter:['class']});
  }

  personaBubbleDocClick = e=>{
    if(e.target instanceof Element && e.target.closest('.ip-bubble')) return;
    closeAllPersonaBubbles();
  };
  document.addEventListener('click', personaBubbleDocClick);
  personaBubbleDocKeydown = e=>{
    if(e.key !== 'Escape' || !personaBubbleRecords.some(record=>record.open)) return;
    e.preventDefault();
    closeAllPersonaBubbles(true);
  };
  document.addEventListener('keydown', personaBubbleDocKeydown);

  personaBubbleResize = schedulePersonaBubbleLayout;
  window.addEventListener('resize', personaBubbleResize, {passive:true});
  if(typeof ResizeObserver !== 'undefined'){
    personaBubbleResizeObserver = new ResizeObserver(schedulePersonaBubbleLayout);
    personaBubbleResizeObserver.observe(layer);
  }
  if(document.fonts?.ready){
    document.fonts.ready.then(()=>{
      if(layer.isConnected) schedulePersonaBubbleLayout();
    });
  }
}

function destroyPersonaBubbles(){
  if(personaBubbleDocClick){
    document.removeEventListener('click', personaBubbleDocClick);
    personaBubbleDocClick = null;
  }
  if(personaBubbleDocKeydown){
    document.removeEventListener('keydown', personaBubbleDocKeydown);
    personaBubbleDocKeydown = null;
  }
  if(personaBubbleResize){
    window.removeEventListener('resize', personaBubbleResize);
    personaBubbleResize = null;
  }
  if(personaBubbleResizeObserver){
    personaBubbleResizeObserver.disconnect();
    personaBubbleResizeObserver = null;
  }
  if(personaBubbleLayoutRaf){
    cancelAnimationFrame(personaBubbleLayoutRaf);
    personaBubbleLayoutRaf = 0;
  }
  personaBubbleRecords.length = 0;
  const layer = document.getElementById('ip-bubbles');
  if(layer) layer.replaceChildren();
}

function acvSelectText(node){
  const sel=window.getSelection();
  const range=document.createRange();
  range.selectNodeContents(node);
  sel.removeAllRanges();
  sel.addRange(range);
}
async function acvCopy(text,node){
  let done=false;
  if(navigator.clipboard){
    try{await navigator.clipboard.writeText(text);done=true;}catch(e){}
  }
  if(!done){
    let ta=null;
    try{
      ta=document.createElement('textarea');
      ta.value=text;
      ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta);
      ta.select();
      done=document.execCommand('copy');
    }catch(e){}
    if(ta&&ta.parentNode)ta.parentNode.removeChild(ta);
  }
  if(!done&&node)acvSelectText(node);
  return done;
}

  if(row.classList.contains('acv-wx')){
    /* 微信按钮：按复制结果给出明确提示；失败时不显示“已复制” */
    acvCopy(text,target).then(ok=>{
      toast(ok ? '微信号已复制' : '复制失败，微信号：'+text);
      if(ok&&badge){badge.classList.add('is-on');clearTimeout(badge._t);badge._t=setTimeout(()=>badge.classList.remove('is-on'),1500);}
    });
    return;
  }
  acvCopy(text,target);
  if(badge){
    badge.classList.add('is-on');
    clearTimeout(badge._t);
    badge._t=setTimeout(()=>badge.classList.remove('is-on'),1500);
  }
});

/* About 首屏滚动动画：IP 底边滚出视口上缘后触发一次 */
let acvAnimDone = false;
let acvAnimRaf = 0;
const acvAnimSkip = () => REDUCED || window.matchMedia('(max-width:900px)').matches;
function acvAnimCleanup(){
  document.querySelectorAll('.acv-glasses,.acv-slide--cn,.acv-slide--en').forEach(el=>{el.style.willChange='';});
}
function acvAnimCheck(){
  acvAnimRaf = 0;
  if(acvAnimDone) return;
  if((location.hash.replace('#','')||'home')!=='about') return;
  const fig = document.querySelector('.acv-ip-figure-wrap');
  if(!fig) return;
  const r = fig.getBoundingClientRect();
  if(r.height <= 0) return;
  const vh = window.innerHeight || document.documentElement.clientHeight;
  const visible = Math.min(r.bottom, vh) - Math.max(r.top, 0);
  if(visible < r.height * 0.3) return;
  acvAnimDone = true;
  pageView.classList.add('acv-anim-done');
  setTimeout(acvAnimCleanup, 900);
}
function acvAnimSchedule(){
  if(acvAnimRaf) return;
  acvAnimRaf = requestAnimationFrame(acvAnimCheck);
}
function setupAcvScrollAnim(){
  acvAnimDone = false;
  pageView.classList.remove('acv-anim-done');
  const fig = document.querySelector('.acv-ip-figure-wrap');
  if(!fig) return;
  if(acvAnimSkip()){
    acvAnimDone = true;
    pageView.classList.add('acv-anim-done');
    acvAnimCleanup();
    return;
  }
  const r = fig.getBoundingClientRect();
  const vh = window.innerHeight || document.documentElement.clientHeight;
  const visible = Math.min(r.bottom, vh) - Math.max(r.top, 0);
  if(visible >= r.height * 0.3){
    setTimeout(()=>{
      if(!acvAnimDone){
        acvAnimDone = true;
        pageView.classList.add('acv-anim-done');
        setTimeout(acvAnimCleanup, 900);
      }
    }, 400);
  }
}
window.addEventListener('scroll', acvAnimSchedule, {passive:true});

/* My Style 折叠：IP舞台默认收起 */
let ipStyleCollapsed = true;
function acvToggleIpStyle(){
  const hero = document.getElementById('ip-hero');
  const collapse = document.getElementById('acv-ip-collapse');
  const toggle = document.getElementById('acv-style-toggle');
  if(!hero || !toggle) return;
  const icon = toggle.querySelector('.acv-style-icon');
  if(ipStyleCollapsed){
    hero.classList.add('is-open');
    toggle.setAttribute('aria-expanded','true');
    if(icon) icon.textContent = '－';
    hero.addEventListener('transitionend', function onEnd(e){
      if(e.propertyName === 'height'){
        hero.removeEventListener('transitionend', onEnd);
        if(hero.classList.contains('is-open')){
          if(ipLastPoint) handleIpGeometryChange();
        }
      }
    });
  } else {
    hero.classList.remove('is-open');
    toggle.setAttribute('aria-expanded','false');
    if(icon) icon.textContent = '＋';
    ipLastPoint = null;
    ipBubbleDir = null;
    ipShowPose('0000', 'center-center', false);
  }
  ipStyleCollapsed = !ipStyleCollapsed;
}
document.addEventListener('click', e=>{
  if(e.target.closest('#acv-style-toggle')) acvToggleIpStyle();
});

/* My style 图形动效：待机/悬停/按下 */
let acvStyleClicked = false;
let acvStyleIdleRunning = false;
let acvStyleHovering = false;
let acvStyleResumeTimer = 0;
let acvStyleObserver = null;
let acvStyleFirstAt = 0;   /* 本次访问首次起跳的时间戳，0 表示尚未跳过 */
let acvStyleStartTimer = 0;
/* 进入视口时启动：首次 0.3s 后立刻跳一次；再次进入则接续原周期相位，不重复立刻跳 */
function acvStyleKick(t){
  if(acvStyleIdleRunning || acvStyleStartTimer) return;
  if(!acvStyleFirstAt){
    acvStyleStartTimer = setTimeout(()=>{
      acvStyleStartTimer = 0;
      acvStyleFirstAt = performance.now();
      t.style.removeProperty('--mystyle-delay');
      acvStyleStart();
    }, 300);
    return;
  }
  const P = (parseFloat(getComputedStyle(t).getPropertyValue('--mystyle-idle')) || 2) * 1000;
  let ph = (performance.now() - acvStyleFirstAt) % P;
  if(ph < P * .1875) ph = P * .1875; /* 落在跳动段内则跳过，等下一个周期点 */
  t.style.setProperty('--mystyle-delay', (-ph) + 'ms');
  acvStyleStart();
}
function acvStyleApply(){
  const t = document.getElementById('acv-style-toggle');
  if(!t) return;
  const on = acvStyleIdleRunning && !acvStyleClicked && !acvStyleHovering;
  t.classList.toggle('acv-mystyle-idle', on);
}
function acvStyleStart(){
  if(acvStyleIdleRunning) return;
  acvStyleIdleRunning = true;
  acvStyleApply();
}
function acvStyleStop(){
  acvStyleIdleRunning = false;
  acvStyleApply();
}
function acvStyleEnter(){
  if(acvStyleResumeTimer){ clearTimeout(acvStyleResumeTimer); acvStyleResumeTimer = 0; }
  acvStyleHovering = true;
  const t = document.getElementById('acv-style-toggle');
  if(t) t.style.removeProperty('--mystyle-delay');
  acvStyleApply();
}
function acvStyleLeave(){
  if(acvStyleResumeTimer) clearTimeout(acvStyleResumeTimer);
  acvStyleResumeTimer = setTimeout(()=>{
    acvStyleResumeTimer = 0;
    acvStyleHovering = false;
    acvStyleApply();
  }, 1000);
}
function setupAcvStyleIdle(){
  const t = document.getElementById('acv-style-toggle');
  if(!t) return;
  acvStyleClicked = false;
  acvStyleHovering = false;
  acvStyleIdleRunning = false;
  if(acvStyleResumeTimer){ clearTimeout(acvStyleResumeTimer); acvStyleResumeTimer = 0; }
  if(acvStyleStartTimer){ clearTimeout(acvStyleStartTimer); acvStyleStartTimer = 0; }
  t.classList.remove('acv-mystyle-idle','acv-mystyle-paused');
  if(REDUCED) return;
  t.addEventListener('mouseenter', acvStyleEnter);
  t.addEventListener('mouseleave', acvStyleLeave);
  t.addEventListener('focusin', acvStyleEnter);
  t.addEventListener('focusout', acvStyleLeave);
  if(typeof IntersectionObserver !== 'undefined'){
    if(acvStyleObserver) acvStyleObserver.disconnect();
    acvStyleObserver = new IntersectionObserver(entries=>{
      const inView = entries.some(en=>en.isIntersecting);
      t.classList.toggle('acv-mystyle-paused', !inView);
      if(inView) acvStyleKick(t);
    });
    acvStyleObserver.observe(t);
  } else {
    acvStyleKick(t);
  }
}
document.addEventListener('click', e=>{
  if(e.target.closest('#acv-style-toggle') && !acvStyleClicked){
    acvStyleClicked = true;
    acvStyleStop();
  }
});

/* 数据区入场动画（方案B） */
function acvStatsCleanup(stats, rank){
  stats.classList.remove('acv-armed','acv-play');
  rank.classList.remove('acv-armed','acv-play');
  stats.querySelectorAll('.k,.t,.d,.acv-plus').forEach(el=>{el.style.willChange='';});
  rank.querySelectorAll('.big,.acv-track i').forEach(el=>{el.style.willChange='';});
}
function acvCountUp(el, target, duration, done){
  const t0 = performance.now();
  function step(t){
    const p = Math.min((t - t0) / duration, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = String(Math.round(target * eased));
    if(p < 1){ requestAnimationFrame(step); }
    else { el.textContent = String(target); if(done) done(); }
  }
  requestAnimationFrame(step);
}
function acvStatsPlay(stats, rank, nums){
  stats.classList.add('acv-play');
  rank.classList.add('acv-play');
  nums.forEach((n, i)=>{
    setTimeout(()=>{
      acvCountUp(n.numEl, n.target, 1200, ()=>{
        if(n.plusEl) n.plusEl.classList.add('acv-pop');
      });
    }, i * 150 + 400);
  });
  setTimeout(()=>acvStatsCleanup(stats, rank), 3200);
}
function acvStatsInit(){
  const stats = document.querySelector('.about-cv .acv-stats');
  const rank = document.querySelector('.about-cv .acv-rank');
  if(!stats || !rank) return;
  if(REDUCED){ acvStatsCleanup(stats, rank); return; }
  const nums = [];
  stats.querySelectorAll('.acv-stat').forEach((stat, i)=>{
    stat.style.setProperty('--i', String(i));
    const nEl = stat.querySelector('.n');
    if(!nEl) return;
    const raw = (nEl.textContent || '').trim();
    const m = raw.match(/^(\d+)(.*)$/);
    if(!m) return;
    const target = parseInt(m[1], 10);
    const suffix = m[2] || '';
    let numEl = nEl, plusEl = null;
    if(suffix){
      nEl.textContent = '';
      numEl = document.createElement('span');
      numEl.className = 'acv-num';
      numEl.textContent = String(target);
      plusEl = document.createElement('span');
      plusEl.className = 'acv-plus';
      plusEl.textContent = suffix;
      nEl.appendChild(numEl);
      nEl.appendChild(plusEl);
    }
    nums.push({numEl:numEl, plusEl:plusEl, target:target});
  });
  stats.classList.add('acv-armed');
  rank.classList.add('acv-armed');
  nums.forEach(n=>{ n.numEl.textContent = '0'; });
  const obs = new IntersectionObserver(entries=>{
    if(entries.some(e=>e.isIntersecting)){
      obs.disconnect();
      acvStatsPlay(stats, rank, nums);
    }
  }, {threshold:0.3});
  obs.observe(stats);
}

/* 01 能力区：单图标位轮换（悬停变橙，无标签/描边/圆点/锁定） */
function acvRender(state){
  state.lis.forEach((li, i)=>{
    const active = i === state.current;
    li.classList.toggle('is-active', active);
    li.setAttribute('aria-hidden', active ? 'false' : 'true');
    const ico = li.querySelector('.acv-ico');
    if(ico) ico.setAttribute('tabindex', active ? '0' : '-1');
  });
}
function acvReset(state, delay){
  clearTimeout(state.timer);
  state.timer = null;
  if(REDUCED || state.hovered || !state.inView) return;
  state.timer = setTimeout(()=>{
    state.current = (state.current + 1) % state.lis.length;
    acvRender(state);
    acvReset(state);
  }, delay || 2400);
}
function acvInitCapabilities(){
  const container = document.querySelector('.about-cv .acv-cols');
  if(!container) return;
  container.classList.add('is-carousel');
  const cols = Array.from(container.querySelectorAll('.acv-col'));
  const states = [];
  cols.forEach((col, ci)=>{
    const lis = Array.from(col.querySelectorAll('li'));
    if(!lis.length) return;
    const state = {col, lis, current:0, hovered:false, inView:true, timer:null};
    states.push(state);
    col.addEventListener('mouseenter', ()=>{ state.hovered = true; acvReset(state); });
    col.addEventListener('mouseleave', ()=>{ state.hovered = false; acvReset(state); });
    acvRender(state);
    acvReset(state, 2400 + ci * 600);
  });
  const io = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      const st = states.find(s => s.col === entry.target);
      if(!st) return;
      st.inView = entry.isIntersecting;
      acvReset(st);
    });
  }, {threshold:0.2});
  cols.forEach(col=> io.observe(col));
}

startSkillsLoader();
stylizeAmpersands(document.body);
